<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">AI incident response flow</title>
  <desc id="desc">Six connected steps for responding to an AI-assisted mistake: pause use, contain spread, check facts, notify people, repair harm, and learn.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset="1" stop-color="#e9f0ff"/>
    </linearGradient>
    <linearGradient id="step" x1="0" x2="1">
      <stop offset="0" stop-color="#2454ff"/>
      <stop offset="1" stop-color="#11a99a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1d2430" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="960" height="360" rx="34" fill="url(#bg)"/>
  <g fill="none" stroke="#93a4c7" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 12">
    <path d="M168 144 H292"/>
    <path d="M424 144 H548"/>
    <path d="M680 144 H804"/>
    <path d="M808 216 H680"/>
    <path d="M552 216 H424"/>
  </g>
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">
    <g filter="url(#shadow)">
      <rect x="44" y="84" width="124" height="120" rx="24" fill="#ffffff" stroke="#d8deed"/>
      <circle cx="106" cy="120" r="24" fill="url(#step)"/>
      <text x="106" y="128" font-size="26" font-weight="800" fill="#ffffff">1</text>
      <text x="106" y="164" font-size="18" font-weight="800" fill="#1d2430">Pause</text>
      <text x="106" y="187" font-size="13" fill="#5d6675">stop use</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="300" y="84" width="124" height="120" rx="24" fill="#ffffff" stroke="#d8deed"/>
      <circle cx="362" cy="120" r="24" fill="url(#step)"/>
      <text x="362" y="128" font-size="26" font-weight="800" fill="#ffffff">2</text>
      <text x="362" y="164" font-size="18" font-weight="800" fill="#1d2430">Contain</text>
      <text x="362" y="187" font-size="13" fill="#5d6675">limit spread</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="556" y="84" width="124" height="120" rx="24" fill="#ffffff" stroke="#d8deed"/>
      <circle cx="618" cy="120" r="24" fill="url(#step)"/>
      <text x="618" y="128" font-size="26" font-weight="800" fill="#ffffff">3</text>
      <text x="618" y="164" font-size="18" font-weight="800" fill="#1d2430">Check</text>
      <text x="618" y="187" font-size="13" fill="#5d6675">verify facts</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="812" y="84" width="124" height="120" rx="24" fill="#ffffff" stroke="#d8deed"/>
      <circle cx="874" cy="120" r="24" fill="url(#step)"/>
      <text x="874" y="128" font-size="26" font-weight="800" fill="#ffffff">4</text>
      <text x="874" y="164" font-size="18" font-weight="800" fill="#1d2430">Notify</text>
      <text x="874" y="187" font-size="13" fill="#5d6675">tell affected</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="556" y="216" width="124" height="100" rx="24" fill="#ffffff" stroke="#d8deed"/>
      <circle cx="618" cy="246" r="22" fill="url(#step)"/>
      <text x="618" y="254" font-size="24" font-weight="800" fill="#ffffff">5</text>
      <text x="618" y="286" font-size="18" font-weight="800" fill="#1d2430">Repair</text>
      <text x="618" y="306" font-size="13" fill="#5d6675">fix records</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="300" y="216" width="124" height="100" rx="24" fill="#ffffff" stroke="#d8deed"/>
      <circle cx="362" cy="246" r="22" fill="url(#step)"/>
      <text x="362" y="254" font-size="24" font-weight="800" fill="#ffffff">6</text>
      <text x="362" y="286" font-size="18" font-weight="800" fill="#1d2430">Learn</text>
      <text x="362" y="306" font-size="13" fill="#5d6675">change system</text>
    </g>
  </g>
  <text x="480" y="44" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#1d2430">Respond before quietly moving on</text>
  <text x="480" y="342" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#5d6675">A useful response protects people first, then improves the workflow that let the mistake through.</text>
</svg>
