<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AI pilot exit criteria decision paths</title>
  <desc id="desc">A central evidence review leads to four possible AI pilot decisions: expand, narrow, pause, or stop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f4ea"/>
      <stop offset="1" stop-color="#dde7ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2454ff"/>
      <stop offset="1" stop-color="#66e3d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1c2430" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="44" fill="url(#bg)"/>
  <g fill="none" stroke="#b9c3d8" stroke-width="4" stroke-linecap="round">
    <path d="M600 318 C600 226 392 226 330 170"/>
    <path d="M600 318 C600 226 808 226 870 170"/>
    <path d="M600 442 C600 534 392 534 330 590"/>
    <path d="M600 442 C600 534 808 534 870 590"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="410" y="286" width="380" height="188" rx="34" fill="#10131a"/>
    <text x="600" y="344" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#ffffff">Evidence review</text>
    <text x="600" y="386" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="20" fill="#dbe6ff">baseline + outcomes + harms</text>
    <text x="600" y="424" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="20" fill="#dbe6ff">costs + feedback + owner signoff</text>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" filter="url(#shadow)">
    <rect x="92" y="82" width="360" height="176" rx="30" fill="#ffffff"/>
    <circle cx="140" cy="132" r="25" fill="url(#blue)"/>
    <text x="140" y="141" text-anchor="middle" font-size="25" font-weight="900" fill="#06101c">1</text>
    <text x="178" y="124" font-size="31" font-weight="900" fill="#172033">Expand</text>
    <text x="126" y="172" font-size="19" fill="#4f5c70">Only when benefits are proven,</text>
    <text x="126" y="200" font-size="19" fill="#4f5c70">risks are controlled, and the</text>
    <text x="126" y="228" font-size="19" fill="#4f5c70">ordinary workflow can sustain it.</text>

    <rect x="748" y="82" width="360" height="176" rx="30" fill="#ffffff"/>
    <circle cx="796" cy="132" r="25" fill="#ffd166"/>
    <text x="796" y="141" text-anchor="middle" font-size="25" font-weight="900" fill="#06101c">2</text>
    <text x="834" y="124" font-size="31" font-weight="900" fill="#172033">Narrow</text>
    <text x="782" y="172" font-size="19" fill="#4f5c70">Limit to cases where evidence is</text>
    <text x="782" y="200" font-size="19" fill="#4f5c70">strong; exclude high-risk, hard,</text>
    <text x="782" y="228" font-size="19" fill="#4f5c70">or unsupported use cases.</text>

    <rect x="92" y="502" width="360" height="176" rx="30" fill="#ffffff"/>
    <circle cx="140" cy="552" r="25" fill="#ffb86b"/>
    <text x="140" y="561" text-anchor="middle" font-size="25" font-weight="900" fill="#06101c">3</text>
    <text x="178" y="544" font-size="31" font-weight="900" fill="#172033">Pause</text>
    <text x="126" y="592" font-size="19" fill="#4f5c70">Hold the pilot when evidence is</text>
    <text x="126" y="620" font-size="19" fill="#4f5c70">missing, mixed, inaccessible, or</text>
    <text x="126" y="648" font-size="19" fill="#4f5c70">not safe enough for a decision.</text>

    <rect x="748" y="502" width="360" height="176" rx="30" fill="#ffffff"/>
    <circle cx="796" cy="552" r="25" fill="#ff6b6b"/>
    <text x="796" y="561" text-anchor="middle" font-size="25" font-weight="900" fill="#06101c">4</text>
    <text x="834" y="544" font-size="31" font-weight="900" fill="#172033">Stop</text>
    <text x="782" y="592" font-size="19" fill="#4f5c70">End use when harms, failures,</text>
    <text x="782" y="620" font-size="19" fill="#4f5c70">legal limits, hidden costs, or lack</text>
    <text x="782" y="648" font-size="19" fill="#4f5c70">of value outweigh benefits.</text>
  </g>
  <text x="600" y="724" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="18" fill="#435169">Do not let pilot momentum become default adoption. Decide with evidence, limits, and a recheck date.</text>
</svg>
