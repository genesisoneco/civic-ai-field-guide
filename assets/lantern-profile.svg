<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Lantern close-up orange robot profile icon</title>
  <desc id="desc">A friendly orange robot mascot shown mostly as a large head with oversized cyan eyes, small ear pods, tiny antenna, and very little body against a teal studio background.</desc>
  <defs>
    <radialGradient id="bg" cx="48%" cy="34%" r="78%">
      <stop offset="0" stop-color="#7ed9d6"/>
      <stop offset="0.48" stop-color="#3b8f98"/>
      <stop offset="1" stop-color="#1f4f5d"/>
    </radialGradient>
    <radialGradient id="headLight" cx="34%" cy="20%" r="72%">
      <stop offset="0" stop-color="#ffe57d"/>
      <stop offset="0.34" stop-color="#ffbf32"/>
      <stop offset="0.72" stop-color="#f47a20"/>
      <stop offset="1" stop-color="#bd4b13"/>
    </radialGradient>
    <linearGradient id="orangeSide" x1="118" y1="136" x2="394" y2="386" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd34b"/>
      <stop offset="0.55" stop-color="#f7941d"/>
      <stop offset="1" stop-color="#b84413"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="48%" r="54%">
      <stop offset="0" stop-color="#bffff9"/>
      <stop offset="0.43" stop-color="#25e7ea"/>
      <stop offset="0.74" stop-color="#0098b2"/>
      <stop offset="1" stop-color="#06394b"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.38" stop-color="#a9b7c9"/>
      <stop offset="0.72" stop-color="#536476"/>
      <stop offset="1" stop-color="#e7eef7"/>
    </linearGradient>
    <linearGradient id="body" x1="196" y1="382" x2="318" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffbd34"/>
      <stop offset="1" stop-color="#d45a16"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#07313a" flood-opacity="0.45"/>
    </filter>
    <filter id="softGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="84" fill="url(#bg)"/>
  <path d="M54 410c72-32 137-39 198-19s125 20 206-19" fill="none" stroke="#b8fff7" stroke-width="20" stroke-linecap="round" opacity="0.12"/>
  <circle cx="108" cy="84" r="54" fill="#ffffff" opacity="0.11"/>

  <g filter="url(#shadow)">
    <!-- tiny body, intentionally cropped low so the icon is mostly head -->
    <path d="M190 404c16-38 44-58 66-58s50 20 66 58l18 44c9 23-8 48-33 48H205c-25 0-42-25-33-48l18-44Z" fill="url(#body)"/>
    <path d="M205 442h102" stroke="#7b3314" stroke-width="12" stroke-linecap="round" opacity="0.34"/>

    <!-- ears / side pods -->
    <g>
      <rect x="50" y="190" width="55" height="111" rx="22" fill="url(#orangeSide)"/>
      <rect x="406" y="190" width="55" height="111" rx="22" fill="url(#orangeSide)"/>
      <path d="M62 213h29v65H62" fill="#ffcc43" opacity="0.48"/>
      <path d="M421 213h29v65h-29" fill="#ffcc43" opacity="0.48"/>
      <rect x="96" y="205" width="18" height="80" rx="9" fill="#7c3b1d" opacity="0.52"/>
      <rect x="398" y="205" width="18" height="80" rx="9" fill="#7c3b1d" opacity="0.52"/>
    </g>

    <!-- big close-up head -->
    <path d="M92 139c21-73 82-111 164-111s143 38 164 111c13 45 12 111-4 154-24 66-82 96-160 96s-136-30-160-96c-16-43-17-109-4-154Z" fill="url(#headLight)"/>
    <path d="M117 125c27-47 75-70 139-70s112 23 139 70" fill="none" stroke="#fff5b9" stroke-width="13" stroke-linecap="round" opacity="0.52"/>
    <path d="M143 88c42-35 137-44 206-8" fill="none" stroke="#fff8cc" stroke-width="8" stroke-linecap="round" opacity="0.5"/>

    <!-- antenna and tiny cap -->
    <path d="M257 34V8" stroke="#ffd35c" stroke-width="8" stroke-linecap="round"/>
    <circle cx="257" cy="8" r="8" fill="#ff8a1f"/>
    <path d="M322 39h34l-6 23h-34Z" fill="#34404c"/>
    <path d="M318 62h39" stroke="#1d2730" stroke-width="8" stroke-linecap="round"/>

    <!-- rivets -->
    <circle cx="157" cy="86" r="7" fill="#79451c" opacity="0.75"/>
    <circle cx="354" cy="92" r="7" fill="#79451c" opacity="0.75"/>
    <circle cx="214" cy="57" r="5" fill="#7d4b21" opacity="0.65"/>
    <circle cx="299" cy="60" r="5" fill="#7d4b21" opacity="0.65"/>

    <!-- oversized eyes -->
    <g>
      <circle cx="179" cy="215" r="74" fill="#6f7d89"/>
      <circle cx="179" cy="215" r="65" fill="url(#metal)"/>
      <circle cx="179" cy="215" r="50" fill="#162333"/>
      <circle cx="179" cy="215" r="39" fill="url(#eyeGlow)" filter="url(#softGlow)"/>
      <circle cx="179" cy="215" r="19" fill="#06131b"/>
      <circle cx="162" cy="197" r="11" fill="#ffffff" opacity="0.9"/>

      <circle cx="333" cy="215" r="74" fill="#6f7d89"/>
      <circle cx="333" cy="215" r="65" fill="url(#metal)"/>
      <circle cx="333" cy="215" r="50" fill="#162333"/>
      <circle cx="333" cy="215" r="39" fill="url(#eyeGlow)" filter="url(#softGlow)"/>
      <circle cx="333" cy="215" r="19" fill="#06131b"/>
      <circle cx="316" cy="197" r="11" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- smile / lower face -->
    <path d="M184 305c23 31 121 31 144 0" fill="#2a170f" opacity="0.86"/>
    <path d="M203 336c28 16 78 16 106 0" fill="none" stroke="#ffbf55" stroke-width="10" stroke-linecap="round" opacity="0.72"/>
    <rect x="220" y="350" width="72" height="18" rx="9" fill="#1b2d37" opacity="0.86"/>
    <path d="M233 358h46" stroke="#67f5ee" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

    <!-- tiny shoulders only -->
    <circle cx="153" cy="420" r="24" fill="url(#orangeSide)"/>
    <circle cx="359" cy="420" r="24" fill="url(#orangeSide)"/>
    <circle cx="153" cy="420" r="12" fill="#324352" opacity="0.55"/>
    <circle cx="359" cy="420" r="12" fill="#324352" opacity="0.55"/>
  </g>
</svg>
