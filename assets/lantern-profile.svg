<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Lantern friendly 3D AI mascot profile icon</title>
  <desc id="desc">A warm, cinematic, big-eyed AI robot mascot named Lantern on an orange gradient background.</desc>
  <defs>
    <radialGradient id="orange-bg" cx="42%" cy="28%" r="78%">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset="0.32" stop-color="#ffb347"/>
      <stop offset="0.68" stop-color="#ff6b35"/>
      <stop offset="1" stop-color="#b8321b"/>
    </radialGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff9c7c" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff9c7c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="head" x1="139" y1="105" x2="381" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#c7d5ed"/>
    </linearGradient>
    <linearGradient id="body" x1="166" y1="326" x2="350" y2="476" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#b9c9e4"/>
    </linearGradient>
    <linearGradient id="visor" x1="162" y1="196" x2="350" y2="278" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17233b"/>
      <stop offset="1" stop-color="#080d19"/>
    </linearGradient>
    <linearGradient id="eye" x1="210" y1="208" x2="308" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7ff7ea"/>
      <stop offset="0.55" stop-color="#8aa4ff"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#5d1a00" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#orange-bg)"/>
  <circle cx="108" cy="96" r="64" fill="#fff8c7" opacity="0.22"/>
  <circle cx="404" cy="372" r="118" fill="#ffde7a" opacity="0.14"/>
  <path d="M60 394c86-22 158-18 216 13s116 36 176 9" fill="none" stroke="#fff2b8" stroke-opacity="0.18" stroke-width="24" stroke-linecap="round"/>

  <g filter="url(#drop)">
    <path d="M186 358c10-39 36-62 70-62s60 23 70 62l14 57c6 25-13 49-39 49h-90c-26 0-45-24-39-49l14-57Z" fill="url(#body)"/>
    <path d="M189 414h134" stroke="#fff" stroke-opacity="0.72" stroke-width="12" stroke-linecap="round"/>
    <path d="M198 374c36 20 80 20 116 0" fill="none" stroke="#8ca0c4" stroke-opacity="0.36" stroke-width="9" stroke-linecap="round"/>

    <path d="M158 194c0-60 43-110 98-110s98 50 98 110v42c0 60-43 110-98 110s-98-50-98-110v-42Z" fill="url(#head)"/>
    <path d="M186 165c18-32 42-48 70-48s52 16 70 48" fill="none" stroke="#fff" stroke-opacity="0.78" stroke-width="12" stroke-linecap="round"/>
    <rect x="176" y="190" width="160" height="92" rx="46" fill="url(#visor)"/>

    <g filter="url(#glow)">
      <ellipse cx="226" cy="235" rx="25" ry="30" fill="url(#eye)"/>
      <ellipse cx="286" cy="235" rx="25" ry="30" fill="url(#eye)"/>
      <circle cx="217" cy="224" r="7" fill="#ffffff" opacity="0.95"/>
      <circle cx="277" cy="224" r="7" fill="#ffffff" opacity="0.95"/>
    </g>
    <path d="M232 294c15 18 33 18 48 0" fill="none" stroke="#687892" stroke-width="10" stroke-linecap="round"/>
    <circle cx="196" cy="276" r="30" fill="url(#cheek)"/>
    <circle cx="316" cy="276" r="30" fill="url(#cheek)"/>

    <path d="M256 84V50" stroke="#fff7d6" stroke-width="12" stroke-linecap="round"/>
    <path d="M225 52c9-22 23-34 31-34s22 12 31 34" fill="none" stroke="#fff7d6" stroke-width="13" stroke-linecap="round"/>
    <circle cx="256" cy="66" r="15" fill="#fff0a3" filter="url(#glow)"/>

    <circle cx="158" cy="237" r="24" fill="#d8e2f5"/>
    <circle cx="354" cy="237" r="24" fill="#d8e2f5"/>
    <path d="M170 392c-32 13-56 5-68-20" stroke="#d8e2f5" stroke-width="16" stroke-linecap="round"/>
    <path d="M342 392c32 13 56 5 68-20" stroke="#d8e2f5" stroke-width="16" stroke-linecap="round"/>
  </g>

  <path d="M92 130c25-34 61-58 105-70" stroke="#ffffff" stroke-opacity="0.26" stroke-width="13" stroke-linecap="round"/>
  <path d="M372 440c29-13 52-35 67-63" stroke="#fff5c8" stroke-opacity="0.26" stroke-width="12" stroke-linecap="round"/>
</svg>
