<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">AI data minimization funnel</title>
  <desc id="desc">A funnel diagram showing an AI workflow narrowing from purpose to necessary fields, redaction, short retention, limited access, and deletion review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f2e4"/>
      <stop offset="1" stop-color="#e8f2ff"/>
    </linearGradient>
    <linearGradient id="funnel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#8ea2ff"/>
      <stop offset="1" stop-color="#66e3d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1d2430" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="34" fill="url(#bg)"/>
  <g fill="none" stroke="#d2c6ad" stroke-width="1" opacity="0.65">
    <path d="M80 92h800M80 180h800M80 268h800M80 356h800M80 444h800"/>
    <path d="M160 60v420M320 60v420M480 60v420M640 60v420M800 60v420"/>
  </g>
  <text x="88" y="76" fill="#1d2430" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" font-weight="800">Minimize before AI sees the data</text>
  <text x="88" y="112" fill="#5d6675" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18">Purpose → fewer fields → redaction → short retention → limited access → deletion review</text>

  <g filter="url(#shadow)">
    <path d="M230 150h500l-78 86H308z" fill="#ffffff" stroke="#2454ff" stroke-width="3"/>
    <path d="M308 252h344l-62 74H370z" fill="#f5f8ff" stroke="#2454ff" stroke-width="3"/>
    <path d="M370 342h220l-50 66H420z" fill="#eefcf9" stroke="#116b59" stroke-width="3"/>
    <path d="M420 424h120l-26 46h-68z" fill="url(#funnel)" stroke="#116b59" stroke-width="3"/>
  </g>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">
    <text x="480" y="190" fill="#1d2430" font-size="24" font-weight="800">1. Define the purpose</text>
    <text x="480" y="218" fill="#5d6675" font-size="16">No vague “improve services” bucket</text>
    <text x="480" y="287" fill="#1d2430" font-size="22" font-weight="800">2. Keep only necessary fields</text>
    <text x="480" y="314" fill="#5d6675" font-size="15">Remove optional, unknown, or prohibited data</text>
    <text x="480" y="375" fill="#1d2430" font-size="20" font-weight="800">3. Redact and protect</text>
    <text x="480" y="400" fill="#5d6675" font-size="14">Mask identifiers; restrict raw access</text>
    <text x="480" y="456" fill="#071018" font-size="17" font-weight="900">4. Delete or review</text>
  </g>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#1d2430">
    <rect x="88" y="164" width="126" height="58" rx="16" fill="#fffaf0" stroke="#ded2bd"/>
    <text x="151" y="188" text-anchor="middle" font-weight="800">Prompts</text>
    <text x="151" y="210" text-anchor="middle" fill="#5d6675">omit details</text>
    <rect x="746" y="164" width="126" height="58" rx="16" fill="#fffaf0" stroke="#ded2bd"/>
    <text x="809" y="188" text-anchor="middle" font-weight="800">Uploads</text>
    <text x="809" y="210" text-anchor="middle" fill="#5d6675">use excerpts</text>
    <rect x="92" y="334" width="136" height="64" rx="16" fill="#fffaf0" stroke="#ded2bd"/>
    <text x="160" y="359" text-anchor="middle" font-weight="800">Logs</text>
    <text x="160" y="381" text-anchor="middle" fill="#5d6675">short retention</text>
    <rect x="732" y="334" width="144" height="64" rx="16" fill="#fffaf0" stroke="#ded2bd"/>
    <text x="804" y="359" text-anchor="middle" font-weight="800">Outputs</text>
    <text x="804" y="381" text-anchor="middle" fill="#5d6675">review before record</text>
  </g>
</svg>
