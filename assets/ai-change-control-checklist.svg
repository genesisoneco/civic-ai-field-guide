<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">AI change control checklist flow</title>
  <desc id="desc">A proposed AI change flows through impact screening, evidence review, notice and records updates, approval, monitoring, or pause.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f4ea"/>
      <stop offset="1" stop-color="#e8f1ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#2454ff"/>
      <stop offset="1" stop-color="#16a394"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1c2430" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#5d6675"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="34" fill="url(#bg)"/>
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" fill="#1c2430">
    <text x="56" y="68" font-size="30" font-weight="800">AI change control</text>
    <text x="56" y="100" font-size="17" fill="#5d6675">Do not treat every update as routine. Match the review to the impact.</text>

    <g filter="url(#shadow)">
      <rect x="58" y="166" width="180" height="110" rx="22" fill="#fffaf0" stroke="#ded2bd"/>
      <text x="88" y="206" font-size="18" font-weight="800">Change proposed</text>
      <text x="88" y="234" font-size="14" fill="#5d6675">model, data, prompt,</text>
      <text x="88" y="254" font-size="14" fill="#5d6675">vendor, workflow, policy</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="298" y="150" width="190" height="142" rx="22" fill="#fffaf0" stroke="#ded2bd"/>
      <text x="328" y="190" font-size="18" font-weight="800">Impact screen</text>
      <text x="328" y="219" font-size="14" fill="#5d6675">Who is affected?</text>
      <text x="328" y="239" font-size="14" fill="#5d6675">What decisions change?</text>
      <text x="328" y="259" font-size="14" fill="#5d6675">What evidence is stale?</text>
    </g>

    <line x1="238" y1="221" x2="292" y2="221" stroke="#5d6675" stroke-width="3" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="548" y="86" width="170" height="96" rx="20" fill="#eef4ff" stroke="#9eb3ff"/>
      <text x="579" y="123" font-size="17" font-weight="800">Retest</text>
      <text x="579" y="150" font-size="14" fill="#5d6675">local cases, failures,</text>
      <text x="579" y="169" font-size="14" fill="#5d6675">accessibility, safety</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="548" y="222" width="170" height="96" rx="20" fill="#fffaf0" stroke="#ded2bd"/>
      <text x="579" y="259" font-size="17" font-weight="800">Update notices</text>
      <text x="579" y="286" font-size="14" fill="#5d6675">public, staff, records,</text>
      <text x="579" y="305" font-size="14" fill="#5d6675">training, appeal paths</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="548" y="358" width="170" height="96" rx="20" fill="#effaf6" stroke="#85d9c9"/>
      <text x="579" y="395" font-size="17" font-weight="800">Approve + monitor</text>
      <text x="579" y="422" font-size="14" fill="#5d6675">owner, date, metrics,</text>
      <text x="579" y="441" font-size="14" fill="#5d6675">rollback trigger</text>
    </g>

    <line x1="488" y1="202" x2="542" y2="142" stroke="#5d6675" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="488" y1="221" x2="542" y2="270" stroke="#5d6675" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="488" y1="248" x2="542" y2="404" stroke="#5d6675" stroke-width="3" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="768" y="203" width="134" height="134" rx="26" fill="#fff1e8" stroke="#ffb86b"/>
      <text x="802" y="250" font-size="19" font-weight="900" fill="#8a3d00">Pause</text>
      <text x="792" y="281" font-size="14" fill="#5d6675">if evidence,</text>
      <text x="792" y="301" font-size="14" fill="#5d6675">authority, or</text>
      <text x="792" y="321" font-size="14" fill="#5d6675">safeguards fail</text>
    </g>
    <line x1="718" y1="270" x2="762" y2="270" stroke="#5d6675" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="56" y="438" width="418" height="46" rx="23" fill="url(#accent)" opacity="0.95"/>
    <text x="84" y="468" font-size="17" font-weight="800" fill="#ffffff">Log the change before, during, and after deployment.</text>
  </g>
</svg>
