<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI audit trail loop</title>
  <desc id="desc">A five-step loop showing how teams record context, capture the AI role, document human review, log incidents or appeals, and feed corrections back into policy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f3e7"/>
      <stop offset="1" stop-color="#dce9ff"/>
    </linearGradient>
    <linearGradient id="node" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2454ff"/>
      <stop offset="1" stop-color="#20bfa9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#17213a" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#34425f"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="36" fill="url(#bg)"/>
  <g opacity="0.35" stroke="#ffffff" stroke-width="2">
    <path d="M88 100H1112M88 200H1112M88 300H1112M88 400H1112M88 500H1112M88 600H1112"/>
    <path d="M160 70V650M320 70V650M480 70V650M640 70V650M800 70V650M960 70V650"/>
  </g>
  <text x="600" y="76" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="800" fill="#17213a">AI audit trails make review possible</text>
  <text x="600" y="118" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#42506b">Record the minimum facts needed to verify, appeal, correct, and learn.</text>

  <g fill="none" stroke="#34425f" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M383 224 C470 168 590 158 687 204"/>
    <path d="M819 289 C895 374 886 486 811 560"/>
    <path d="M684 615 C578 661 457 633 384 550"/>
    <path d="M280 454 C235 365 255 288 329 229"/>
  </g>

  <g font-family="Inter, system-ui, sans-serif" filter="url(#shadow)">
    <g transform="translate(150 168)">
      <rect width="250" height="142" rx="28" fill="#fffaf0" stroke="#c6d0df" stroke-width="2"/>
      <circle cx="42" cy="44" r="26" fill="url(#node)"/>
      <text x="42" y="53" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">1</text>
      <text x="84" y="44" font-size="23" font-weight="800" fill="#17213a">Record context</text>
      <text x="28" y="86" font-size="16" fill="#4d5a73">Purpose, owner, date,</text>
      <text x="28" y="110" font-size="16" fill="#4d5a73">stakes, people affected.</text>
    </g>
    <g transform="translate(475 150)">
      <rect width="250" height="142" rx="28" fill="#fffaf0" stroke="#c6d0df" stroke-width="2"/>
      <circle cx="42" cy="44" r="26" fill="url(#node)"/>
      <text x="42" y="53" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">2</text>
      <text x="84" y="44" font-size="23" font-weight="800" fill="#17213a">Capture AI role</text>
      <text x="28" y="86" font-size="16" fill="#4d5a73">Tool/version, input type,</text>
      <text x="28" y="110" font-size="16" fill="#4d5a73">output use, known limits.</text>
    </g>
    <g transform="translate(800 246)">
      <rect width="250" height="142" rx="28" fill="#fffaf0" stroke="#c6d0df" stroke-width="2"/>
      <circle cx="42" cy="44" r="26" fill="url(#node)"/>
      <text x="42" y="53" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">3</text>
      <text x="84" y="44" font-size="23" font-weight="800" fill="#17213a">Human review</text>
      <text x="28" y="86" font-size="16" fill="#4d5a73">Who checked, what changed,</text>
      <text x="28" y="110" font-size="16" fill="#4d5a73">and what was rejected.</text>
    </g>
    <g transform="translate(612 498)">
      <rect width="276" height="142" rx="28" fill="#fffaf0" stroke="#c6d0df" stroke-width="2"/>
      <circle cx="42" cy="44" r="26" fill="url(#node)"/>
      <text x="42" y="53" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">4</text>
      <text x="84" y="44" font-size="23" font-weight="800" fill="#17213a">Appeals &amp; incidents</text>
      <text x="28" y="86" font-size="16" fill="#4d5a73">Complaints, harms, fixes,</text>
      <text x="28" y="110" font-size="16" fill="#4d5a73">notices, and outcomes.</text>
    </g>
    <g transform="translate(206 438)">
      <rect width="276" height="142" rx="28" fill="#fffaf0" stroke="#c6d0df" stroke-width="2"/>
      <circle cx="42" cy="44" r="26" fill="url(#node)"/>
      <text x="42" y="53" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">5</text>
      <text x="84" y="44" font-size="23" font-weight="800" fill="#17213a">Correct policy</text>
      <text x="28" y="86" font-size="16" fill="#4d5a73">Update safeguards, training,</text>
      <text x="28" y="110" font-size="16" fill="#4d5a73">stop rules, and records.</text>
    </g>
  </g>

  <g transform="translate(424 326)">
    <rect width="352" height="106" rx="24" fill="#17213a" opacity="0.92"/>
    <text x="176" y="43" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">Privacy rule</text>
    <text x="176" y="76" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#dce9ff">Keep what proves accountability; avoid excess personal data.</text>
  </g>
</svg>
