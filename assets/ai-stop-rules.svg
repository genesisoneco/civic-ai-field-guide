<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 560">
  <title>AI stop-rule ladder</title>
  <desc>A five-step ladder for deciding when not to use AI: stakes, evidence, consent, recourse, and accountability. If any step is missing, pause the AI use.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131a"/>
      <stop offset="1" stop-color="#222b43"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ea2ff"/>
      <stop offset="1" stop-color="#66e3d4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="960" height="560" rx="34" fill="url(#bg)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.09">
    <path d="M80 80h800M80 170h800M80 260h800M80 350h800M80 440h800"/>
    <path d="M140 50v460M320 50v460M500 50v460M680 50v460M860 50v460"/>
  </g>
  <text x="80" y="82" fill="#f7f3ea" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="34" font-weight="800">Before using AI, climb the stop-rule ladder</text>
  <text x="80" y="122" fill="#b8c4dc" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18">If a rung is missing, pause and fix the process first.</text>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" filter="url(#shadow)">
    <g transform="translate(108 390)">
      <rect width="744" height="66" rx="18" fill="url(#step)"/>
      <circle cx="38" cy="33" r="20" fill="#10131a"/>
      <text x="32" y="40" fill="#f7f3ea" font-size="20" font-weight="800">1</text>
      <text x="78" y="28" fill="#07111f" font-size="22" font-weight="900">Stakes</text>
      <text x="78" y="50" fill="#07111f" font-size="15">Could the output affect rights, safety, money, opportunity, or dignity?</text>
    </g>
    <g transform="translate(158 312)">
      <rect width="644" height="66" rx="18" fill="#f7f3ea"/>
      <circle cx="38" cy="33" r="20" fill="#2454ff"/>
      <text x="32" y="40" fill="#fff" font-size="20" font-weight="800">2</text>
      <text x="78" y="28" fill="#1d2430" font-size="22" font-weight="900">Evidence</text>
      <text x="78" y="50" fill="#4e5868" font-size="15">Has it been tested in this setting, with this data, for this job?</text>
    </g>
    <g transform="translate(208 234)">
      <rect width="544" height="66" rx="18" fill="#f7f3ea"/>
      <circle cx="38" cy="33" r="20" fill="#2454ff"/>
      <text x="32" y="40" fill="#fff" font-size="20" font-weight="800">3</text>
      <text x="78" y="28" fill="#1d2430" font-size="22" font-weight="900">Consent and notice</text>
      <text x="78" y="50" fill="#4e5868" font-size="15">Do affected people know, and is data use appropriate?</text>
    </g>
    <g transform="translate(258 156)">
      <rect width="444" height="66" rx="18" fill="#f7f3ea"/>
      <circle cx="38" cy="33" r="20" fill="#2454ff"/>
      <text x="32" y="40" fill="#fff" font-size="20" font-weight="800">4</text>
      <text x="78" y="28" fill="#1d2430" font-size="22" font-weight="900">Recourse</text>
      <text x="78" y="50" fill="#4e5868" font-size="15">Can people appeal, correct, opt out, or reach a human?</text>
    </g>
    <g transform="translate(308 78)">
      <rect width="344" height="66" rx="18" fill="#ffd166"/>
      <circle cx="38" cy="33" r="20" fill="#10131a"/>
      <text x="32" y="40" fill="#f7f3ea" font-size="20" font-weight="800">5</text>
      <text x="78" y="28" fill="#1d2430" font-size="22" font-weight="900">Accountability</text>
      <text x="78" y="50" fill="#4e5868" font-size="15">Who is responsible when it is wrong?</text>
    </g>
  </g>
  <path d="M735 135c60 44 92 97 92 157 0 75-49 135-124 174" fill="none" stroke="#ffd166" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 18"/>
  <text x="652" y="506" fill="#ffd166" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="800">Missing rung? Do not deploy yet.</text>
</svg>
