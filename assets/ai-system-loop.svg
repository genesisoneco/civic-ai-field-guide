<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 920 420">
  <title id="title">AI system loop</title>
  <desc id="desc">A diagram showing that an AI system includes people and context, data or input, a model, output, a decision or use, and feedback or monitoring.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2454ff" />
    </marker>
    <style>
      .bg { fill:#fffaf0; }
      .box { fill:#f7f3ea; stroke:#2454ff; stroke-width:3; rx:18; }
      .label { fill:#1d2430; font:700 24px system-ui, -apple-system, Segoe UI, sans-serif; }
      .small { fill:#5d6675; font:16px system-ui, -apple-system, Segoe UI, sans-serif; }
      .arrow { fill:none; stroke:#2454ff; stroke-width:4; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="920" height="420" rx="28" />

  <rect class="box" x="54" y="70" width="190" height="94" />
  <text class="label" x="149" y="112" text-anchor="middle">People + context</text>
  <text class="small" x="149" y="139" text-anchor="middle">goal, setting, rules</text>

  <rect class="box" x="366" y="70" width="190" height="94" />
  <text class="label" x="461" y="112" text-anchor="middle">Data / input</text>
  <text class="small" x="461" y="139" text-anchor="middle">prompt, image, record</text>

  <rect class="box" x="678" y="70" width="190" height="94" />
  <text class="label" x="773" y="112" text-anchor="middle">Model</text>
  <text class="small" x="773" y="139" text-anchor="middle">learned patterns</text>

  <rect class="box" x="678" y="256" width="190" height="94" />
  <text class="label" x="773" y="298" text-anchor="middle">Output</text>
  <text class="small" x="773" y="325" text-anchor="middle">score, text, label</text>

  <rect class="box" x="366" y="256" width="190" height="94" />
  <text class="label" x="461" y="298" text-anchor="middle">Decision / use</text>
  <text class="small" x="461" y="325" text-anchor="middle">human or automated</text>

  <rect class="box" x="54" y="256" width="190" height="94" />
  <text class="label" x="149" y="298" text-anchor="middle">Feedback</text>
  <text class="small" x="149" y="325" text-anchor="middle">monitor, appeal, improve</text>

  <path class="arrow" d="M246 117 H354" />
  <path class="arrow" d="M558 117 H666" />
  <path class="arrow" d="M773 166 V244" />
  <path class="arrow" d="M676 303 H568" />
  <path class="arrow" d="M364 303 H256" />
  <path class="arrow" d="M149 256 V180" />
</svg>
