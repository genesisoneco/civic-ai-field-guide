<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 540">
  <title>AI accessibility review loop</title>
  <desc>A five-step loop for reviewing AI accessibility: include users, test inputs, test outputs, provide alternatives, and fix barriers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101a33"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="step" x1="0" x2="1">
      <stop offset="0" stop-color="#8aa4ff"/>
      <stop offset="1" stop-color="#66e3d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="34" fill="url(#bg)"/>
  <circle cx="110" cy="80" r="150" fill="#66e3d4" opacity="0.12"/>
  <circle cx="840" cy="470" r="190" fill="#8aa4ff" opacity="0.16"/>
  <text x="70" y="72" fill="#f8fbff" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="800">AI accessibility review loop</text>
  <text x="70" y="108" fill="#b9c6e6" font-family="Inter, system-ui, sans-serif" font-size="18">Do not test only the model. Test the whole path people must use.</text>

  <g filter="url(#shadow)" font-family="Inter, system-ui, sans-serif">
    <rect x="90" y="180" width="160" height="112" rx="22" fill="#f8fbff"/>
    <text x="118" y="218" fill="#10131a" font-size="18" font-weight="800">1. Include</text>
    <text x="118" y="248" fill="#303746" font-size="15">people with</text>
    <text x="118" y="270" fill="#303746" font-size="15">access needs</text>

    <rect x="305" y="180" width="160" height="112" rx="22" fill="#f8fbff"/>
    <text x="333" y="218" fill="#10131a" font-size="18" font-weight="800">2. Inputs</text>
    <text x="333" y="248" fill="#303746" font-size="15">keyboard, speech,</text>
    <text x="333" y="270" fill="#303746" font-size="15">files, language</text>

    <rect x="520" y="180" width="160" height="112" rx="22" fill="#f8fbff"/>
    <text x="548" y="218" fill="#10131a" font-size="18" font-weight="800">3. Outputs</text>
    <text x="548" y="248" fill="#303746" font-size="15">captions, alt text,</text>
    <text x="548" y="270" fill="#303746" font-size="15">plain language</text>

    <rect x="735" y="180" width="160" height="112" rx="22" fill="#f8fbff"/>
    <text x="763" y="218" fill="#10131a" font-size="18" font-weight="800">4. Alternatives</text>
    <text x="763" y="248" fill="#303746" font-size="15">human help and</text>
    <text x="763" y="270" fill="#303746" font-size="15">non-AI routes</text>

    <rect x="350" y="365" width="260" height="104" rx="26" fill="url(#step)"/>
    <text x="388" y="406" fill="#07101b" font-size="22" font-weight="900">5. Fix barriers</text>
    <text x="388" y="438" fill="#07101b" font-size="16">pause, repair, retest, document</text>
  </g>

  <g fill="none" stroke="#dbe6ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.82">
    <path d="M253 236h45"/>
    <path d="M290 226l14 10-14 10"/>
    <path d="M468 236h45"/>
    <path d="M505 226l14 10-14 10"/>
    <path d="M683 236h45"/>
    <path d="M720 226l14 10-14 10"/>
    <path d="M815 300c0 96-112 129-198 126"/>
    <path d="M629 415l-17 11 17 11"/>
    <path d="M346 424c-117-5-194-42-194-124"/>
    <path d="M141 313l11-17 12 17"/>
  </g>
</svg>
