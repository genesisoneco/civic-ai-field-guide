<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 540">
  <title>AI policy exception review decision path</title>
  <desc>A flow diagram showing a temporary AI policy exception moving through evidence review toward five possible outcomes: close, renew briefly, narrow, escalate, or formalize into policy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7df"/>
      <stop offset="1" stop-color="#e9f0ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2454ff"/>
      <stop offset="1" stop-color="#18a999"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1c2430" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="34" fill="url(#bg)"/>
  <g fill="none" stroke="#d3c6aa" stroke-width="2" opacity="0.7">
    <path d="M80 90h800M80 180h800M80 270h800M80 360h800M80 450h800"/>
    <path d="M160 55v430M320 55v430M480 55v430M640 55v430M800 55v430"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="80" y="76" width="800" height="96" rx="26" fill="#1c2430"/>
    <text x="480" y="116" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff">Temporary AI policy exception</text>
    <text x="480" y="146" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#cbd6ef">Owner, expiry date, safeguard, evidence, and affected workflow are written down.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="270" y="222" width="420" height="94" rx="24" fill="url(#accent)"/>
    <text x="480" y="260" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="800" fill="#ffffff">Review before expiry</text>
    <text x="480" y="289" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#eef7ff">Did need, evidence, risk, notice, and safeguards still justify it?</text>
  </g>
  <g stroke="#1c2430" stroke-width="4" stroke-linecap="round" opacity="0.82">
    <path d="M480 172v50"/>
    <path d="M480 316v34M480 350H150M480 350h330"/>
    <path d="M150 350v34M315 350v34M480 350v34M645 350v34M810 350v34"/>
  </g>
  <g font-family="Inter, system-ui, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <rect x="62" y="386" width="176" height="92" rx="20" fill="#ffffff" stroke="#89b8aa"/>
    <text x="150" y="420" font-size="22" font-weight="800" fill="#116b59">Close</text>
    <text x="150" y="448" font-size="14" fill="#4e5968">Need ended or normal</text>
    <text x="150" y="466" font-size="14" fill="#4e5968">policy covers it.</text>

    <rect x="227" y="386" width="176" height="92" rx="20" fill="#ffffff" stroke="#d6b35a"/>
    <text x="315" y="420" font-size="22" font-weight="800" fill="#8a5a00">Renew briefly</text>
    <text x="315" y="448" font-size="14" fill="#4e5968">Still needed, but</text>
    <text x="315" y="466" font-size="14" fill="#4e5968">expiry stays close.</text>

    <rect x="392" y="386" width="176" height="92" rx="20" fill="#ffffff" stroke="#d6b35a"/>
    <text x="480" y="420" font-size="22" font-weight="800" fill="#8a5a00">Narrow</text>
    <text x="480" y="448" font-size="14" fill="#4e5968">Reduce scope, data,</text>
    <text x="480" y="466" font-size="14" fill="#4e5968">users, or outputs.</text>

    <rect x="557" y="386" width="176" height="92" rx="20" fill="#ffffff" stroke="#de8a8a"/>
    <text x="645" y="420" font-size="22" font-weight="800" fill="#a71930">Escalate</text>
    <text x="645" y="448" font-size="14" fill="#4e5968">Risk or impact needs</text>
    <text x="645" y="466" font-size="14" fill="#4e5968">higher review.</text>

    <rect x="722" y="386" width="176" height="92" rx="20" fill="#ffffff" stroke="#8aa4ff"/>
    <text x="810" y="420" font-size="22" font-weight="800" fill="#2454ff">Formalize</text>
    <text x="810" y="448" font-size="14" fill="#4e5968">Repeated exception</text>
    <text x="810" y="466" font-size="14" fill="#4e5968">becomes policy work.</text>
  </g>
  <text x="80" y="510" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#5d6675">Use the least risky valid outcome. Do not let an expired exception become unmanaged policy by default.</text>
</svg>
