<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">AI grant application review gates</title>
  <desc id="desc">A six-gate review flow for AI-assisted grant applications: funder fit, evidence, budget, promises, compliance, and submit or revise.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset="0.54" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#e8fff8"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2454ff"/>
      <stop offset="1" stop-color="#13a889"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#1f2a44" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="34" fill="url(#bg)"/>
  <g opacity="0.24" stroke="#7d8aa8" stroke-width="1">
    <path d="M72 104h816M72 184h816M72 264h816M72 344h816M72 424h816"/>
    <path d="M160 72v400M280 72v400M400 72v400M520 72v400M640 72v400M760 72v400"/>
  </g>
  <text x="480" y="62" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="31" font-weight="850" fill="#1c2430">Review an AI-assisted grant before submission</text>
  <text x="480" y="98" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="17" fill="#4c586e">Polished grant prose still needs source checks, numbers, commitments, compliance, and ownership.</text>

  <g fill="none" stroke="#2454ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.68">
    <path d="M208 204 C278 138 398 136 471 194"/>
    <path d="M453 191 l24 7 -9 -24"/>
    <path d="M650 199 C735 231 759 323 707 389"/>
    <path d="M708 362 l-5 27 25 -12"/>
    <path d="M296 391 C214 348 198 253 260 196"/>
    <path d="M256 222 l8 -26 -26 8"/>
  </g>

  <g font-family="system-ui, Segoe UI, sans-serif" filter="url(#shadow)">
    <g transform="translate(86 154)">
      <rect width="184" height="96" rx="23" fill="#fffaf0" stroke="#cbd4ea"/>
      <circle cx="34" cy="34" r="19" fill="url(#gate)"/>
      <text x="34" y="41" text-anchor="middle" font-size="19" font-weight="900" fill="#ffffff">1</text>
      <text x="66" y="36" font-size="22" font-weight="850" fill="#1c2430">Funder fit</text>
      <text x="24" y="68" font-size="14" fill="#5d6675">Does the ask match?</text>
    </g>
    <g transform="translate(320 136)">
      <rect width="184" height="96" rx="23" fill="#fffaf0" stroke="#cbd4ea"/>
      <circle cx="34" cy="34" r="19" fill="url(#gate)"/>
      <text x="34" y="41" text-anchor="middle" font-size="19" font-weight="900" fill="#ffffff">2</text>
      <text x="66" y="36" font-size="22" font-weight="850" fill="#1c2430">Evidence</text>
      <text x="24" y="68" font-size="14" fill="#5d6675">Can every claim be shown?</text>
    </g>
    <g transform="translate(566 154)">
      <rect width="184" height="96" rx="23" fill="#fffaf0" stroke="#cbd4ea"/>
      <circle cx="34" cy="34" r="19" fill="url(#gate)"/>
      <text x="34" y="41" text-anchor="middle" font-size="19" font-weight="900" fill="#ffffff">3</text>
      <text x="66" y="36" font-size="22" font-weight="850" fill="#1c2430">Budget</text>
      <text x="24" y="68" font-size="14" fill="#5d6675">Do numbers reconcile?</text>
    </g>
    <g transform="translate(612 324)">
      <rect width="198" height="96" rx="23" fill="#fffaf0" stroke="#cbd4ea"/>
      <circle cx="34" cy="34" r="19" fill="url(#gate)"/>
      <text x="34" y="41" text-anchor="middle" font-size="19" font-weight="900" fill="#ffffff">4</text>
      <text x="66" y="36" font-size="22" font-weight="850" fill="#1c2430">Promises</text>
      <text x="24" y="68" font-size="14" fill="#5d6675">Are deliverables realistic?</text>
    </g>
    <g transform="translate(374 350)">
      <rect width="198" height="96" rx="23" fill="#fffaf0" stroke="#cbd4ea"/>
      <circle cx="34" cy="34" r="19" fill="url(#gate)"/>
      <text x="34" y="41" text-anchor="middle" font-size="19" font-weight="900" fill="#ffffff">5</text>
      <text x="66" y="36" font-size="22" font-weight="850" fill="#1c2430">Compliance</text>
      <text x="24" y="68" font-size="14" fill="#5d6675">Rules and records checked?</text>
    </g>
    <g transform="translate(126 324)">
      <rect width="206" height="96" rx="23" fill="#fffaf0" stroke="#cbd4ea"/>
      <circle cx="34" cy="34" r="19" fill="url(#gate)"/>
      <text x="34" y="41" text-anchor="middle" font-size="19" font-weight="900" fill="#ffffff">6</text>
      <text x="66" y="36" font-size="22" font-weight="850" fill="#1c2430">Submit / revise</text>
      <text x="24" y="68" font-size="14" fill="#5d6675">Named owner signs off.</text>
    </g>
  </g>

  <g transform="translate(320 243)">
    <rect width="320" height="78" rx="25" fill="#10131a" opacity="0.94"/>
    <text x="160" y="31" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="16" font-weight="850" fill="#ffffff">AI is a drafting aid, not a grant officer.</text>
    <text x="160" y="56" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="14" fill="#cbd7f2">Pause if a claim, number, partner, or rule cannot be verified.</text>
  </g>

  <text x="480" y="500" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="15" fill="#516076">Keep reviewer notes with source links, budget version, submission date, and named accountable owner.</text>
</svg>
