<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 560">
  <title>AI agent loop diagram</title>
  <desc>A diagram showing an AI agent loop: a person sets a goal and limits, the agent uses context and memory, chooses a tool or action, observes the result, and either stops for human review or loops again under monitoring.</desc>
  <style>
    :root { color-scheme: light dark; }
    svg { background:#fffaf0; }
    .box { fill:#f7f3ea; stroke:#2c3442; stroke-width:3; }
    .human { fill:#eaf0ff; stroke:#2454ff; stroke-width:3; }
    .risk { fill:#fff1a8; stroke:#8b6f00; stroke-width:3; }
    .arrow { fill:none; stroke:#2c3442; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrowhead); }
    .label { font:700 24px system-ui, -apple-system, Segoe UI, sans-serif; fill:#1d2430; }
    .small { font:18px system-ui, -apple-system, Segoe UI, sans-serif; fill:#3e4655; }
    .caption { font:16px system-ui, -apple-system, Segoe UI, sans-serif; fill:#5d6675; }
    @media (prefers-color-scheme: dark) {
      svg { background:#181d27; }
      .box { fill:#10131a; stroke:#f4efe4; }
      .human { fill:#18264a; stroke:#8ea2ff; }
      .risk { fill:#514600; stroke:#f4d15d; }
      .arrow { stroke:#f4efe4; }
      .label { fill:#f4efe4; }
      .small { fill:#d8d1c5; }
      .caption { fill:#b8b0a2; }
    }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="currentColor" />
    </marker>
  </defs>

  <rect x="36" y="28" width="888" height="504" rx="28" fill="none" stroke="#ded2bd" stroke-width="2" />

  <rect class="human" x="70" y="78" width="250" height="116" rx="20" />
  <text class="label" x="96" y="121">Human goal</text>
  <text class="small" x="96" y="152">task, permissions,</text>
  <text class="small" x="96" y="176">stakes, stop rules</text>

  <rect class="box" x="370" y="72" width="250" height="128" rx="20" />
  <text class="label" x="398" y="115">Agent system</text>
  <text class="small" x="398" y="146">model plus instructions,</text>
  <text class="small" x="398" y="170">context, memory, policy</text>

  <rect class="box" x="670" y="80" width="220" height="112" rx="20" />
  <text class="label" x="702" y="123">Tool/action</text>
  <text class="small" x="702" y="154">search, code, email,</text>
  <text class="small" x="702" y="178">files, API, device</text>

  <rect class="box" x="670" y="310" width="220" height="112" rx="20" />
  <text class="label" x="714" y="353">Observation</text>
  <text class="small" x="714" y="384">result, error,</text>
  <text class="small" x="714" y="408">new information</text>

  <rect class="risk" x="360" y="330" width="280" height="126" rx="20" />
  <text class="label" x="390" y="373">Review or stop?</text>
  <text class="small" x="390" y="404">human approval, logging,</text>
  <text class="small" x="390" y="428">rate limits, rollback</text>

  <rect class="box" x="80" y="320" width="220" height="118" rx="20" />
  <text class="label" x="115" y="363">Outcome</text>
  <text class="small" x="115" y="394">draft, decision support,</text>
  <text class="small" x="115" y="418">completed task</text>

  <path class="arrow" d="M322 136 H360" />
  <path class="arrow" d="M622 136 H660" />
  <path class="arrow" d="M780 194 V300" />
  <path class="arrow" d="M668 368 H650" />
  <path class="arrow" d="M358 392 H312" />
  <path class="arrow" d="M500 330 C500 272 500 250 500 210" />

  <text class="caption" x="82" y="500">Agentic systems can act in loops. The important safety questions are what they can do, when they must stop, and who is accountable.</text>
</svg>
