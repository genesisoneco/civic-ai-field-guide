<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1200 720">
  <title>AI translation language access review loop</title>
  <desc>A five-step loop showing scope, privacy check, AI draft, human review, and feedback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f3ea"/>
      <stop offset="1" stop-color="#dfe9ff"/>
    </linearGradient>
    <linearGradient id="node" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2454ff"/>
      <stop offset="1" stop-color="#16b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1d2430" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#40516f"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="42" fill="url(#bg)"/>
  <circle cx="604" cy="360" r="214" fill="none" stroke="#40516f" stroke-width="8" stroke-dasharray="18 18" opacity="0.32"/>
  <g fill="none" stroke="#40516f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" opacity="0.82">
    <path d="M486 180 C560 130 655 130 728 180"/>
    <path d="M846 305 C872 392 838 482 764 538"/>
    <path d="M645 618 C556 628 475 585 432 508"/>
    <path d="M340 388 C316 300 354 217 426 168"/>
    <path d="M515 450 C574 493 650 488 704 438"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" filter="url(#shadow)">
    <g transform="translate(422 70)">
      <rect width="356" height="126" rx="28" fill="#fffaf0" stroke="#c8d0df" stroke-width="2"/>
      <circle cx="62" cy="63" r="36" fill="url(#node)"/>
      <text x="62" y="76" text-anchor="middle" font-size="36" font-weight="900" fill="#fff">1</text>
      <text x="120" y="52" font-size="25" font-weight="850" fill="#1d2430">Scope need</text>
      <text x="120" y="84" font-size="18" fill="#5d6675">Who needs what, and how high-stakes is it?</text>
    </g>
    <g transform="translate(792 248)">
      <rect width="324" height="126" rx="28" fill="#fffaf0" stroke="#c8d0df" stroke-width="2"/>
      <circle cx="62" cy="63" r="36" fill="url(#node)"/>
      <text x="62" y="76" text-anchor="middle" font-size="36" font-weight="900" fill="#fff">2</text>
      <text x="120" y="52" font-size="25" font-weight="850" fill="#1d2430">Protect privacy</text>
      <text x="120" y="84" font-size="18" fill="#5d6675">Do not paste sensitive text into unsafe tools.</text>
    </g>
    <g transform="translate(652 524)">
      <rect width="356" height="126" rx="28" fill="#fffaf0" stroke="#c8d0df" stroke-width="2"/>
      <circle cx="62" cy="63" r="36" fill="url(#node)"/>
      <text x="62" y="76" text-anchor="middle" font-size="36" font-weight="900" fill="#fff">3</text>
      <text x="120" y="52" font-size="25" font-weight="850" fill="#1d2430">Draft carefully</text>
      <text x="120" y="84" font-size="18" fill="#5d6675">Use AI as a draft, not the final authority.</text>
    </g>
    <g transform="translate(190 524)">
      <rect width="382" height="126" rx="28" fill="#fffaf0" stroke="#c8d0df" stroke-width="2"/>
      <circle cx="62" cy="63" r="36" fill="url(#node)"/>
      <text x="62" y="76" text-anchor="middle" font-size="36" font-weight="900" fill="#fff">4</text>
      <text x="120" y="52" font-size="25" font-weight="850" fill="#1d2430">Human review</text>
      <text x="120" y="84" font-size="18" fill="#5d6675">Qualified review for rights, safety, nuance.</text>
    </g>
    <g transform="translate(86 248)">
      <rect width="348" height="126" rx="28" fill="#fffaf0" stroke="#c8d0df" stroke-width="2"/>
      <circle cx="62" cy="63" r="36" fill="url(#node)"/>
      <text x="62" y="76" text-anchor="middle" font-size="36" font-weight="900" fill="#fff">5</text>
      <text x="120" y="52" font-size="25" font-weight="850" fill="#1d2430">Feedback loop</text>
      <text x="120" y="84" font-size="18" fill="#5d6675">Fix terms, context, access, and process.</text>
    </g>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">
    <rect x="430" y="282" width="340" height="156" rx="32" fill="#1d2430" opacity="0.92"/>
    <text x="600" y="338" font-size="32" font-weight="900" fill="#fffaf0">Language access</text>
    <text x="600" y="378" font-size="21" fill="#dbe6ff">AI may help with speed, but people still need</text>
    <text x="600" y="407" font-size="21" fill="#dbe6ff">privacy, accuracy, context, and recourse.</text>
  </g>
</svg>
