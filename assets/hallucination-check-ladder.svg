<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">AI hallucination check ladder</title>
  <desc id="desc">A four-step ladder for checking AI answers: ask for the claim, compare with sources, verify the evidence, then decide based on stakes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131a"/>
      <stop offset="1" stop-color="#1f2d4d"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ea2ff"/>
      <stop offset="1" stop-color="#66e3d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="36" fill="url(#bg)"/>
  <circle cx="120" cy="110" r="76" fill="#66e3d4" opacity="0.16"/>
  <circle cx="835" cy="440" r="115" fill="#8ea2ff" opacity="0.18"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2">
    <path d="M80 455H880"/>
    <path d="M80 355H880"/>
    <path d="M80 255H880"/>
    <path d="M80 155H880"/>
  </g>
  <text x="70" y="72" fill="#f8fbff" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="800">When an AI answer sounds certain, climb the check ladder.</text>
  <text x="72" y="108" fill="#b8c7e6" font-family="Inter, system-ui, sans-serif" font-size="18">Do not ask “Is it fluent?” Ask “What would make this safe to rely on?”</text>

  <g filter="url(#shadow)" font-family="Inter, system-ui, sans-serif">
    <g transform="translate(120 365)">
      <rect width="720" height="74" rx="22" fill="#fffaf0"/>
      <circle cx="42" cy="37" r="22" fill="url(#step)"/>
      <text x="42" y="45" text-anchor="middle" fill="#071019" font-size="22" font-weight="900">1</text>
      <text x="84" y="32" fill="#1d2430" font-size="22" font-weight="800">Name the exact claim</text>
      <text x="84" y="56" fill="#5d6675" font-size="16">What is being asserted, and what part could be wrong?</text>
    </g>
    <g transform="translate(160 275)">
      <rect width="640" height="74" rx="22" fill="#fffaf0"/>
      <circle cx="42" cy="37" r="22" fill="url(#step)"/>
      <text x="42" y="45" text-anchor="middle" fill="#071019" font-size="22" font-weight="900">2</text>
      <text x="84" y="32" fill="#1d2430" font-size="22" font-weight="800">Compare with source material</text>
      <text x="84" y="56" fill="#5d6675" font-size="16">Look for documents, data, logs, policies, or people with direct knowledge.</text>
    </g>
    <g transform="translate(200 185)">
      <rect width="560" height="74" rx="22" fill="#fffaf0"/>
      <circle cx="42" cy="37" r="22" fill="url(#step)"/>
      <text x="42" y="45" text-anchor="middle" fill="#071019" font-size="22" font-weight="900">3</text>
      <text x="84" y="32" fill="#1d2430" font-size="22" font-weight="800">Check uncertainty and stakes</text>
      <text x="84" y="56" fill="#5d6675" font-size="16">Higher impact needs stronger evidence and human review.</text>
    </g>
    <g transform="translate(240 95)">
      <rect width="480" height="74" rx="22" fill="#fffaf0"/>
      <circle cx="42" cy="37" r="22" fill="url(#step)"/>
      <text x="42" y="45" text-anchor="middle" fill="#071019" font-size="22" font-weight="900">4</text>
      <text x="84" y="32" fill="#1d2430" font-size="22" font-weight="800">Decide what can be used</text>
      <text x="84" y="56" fill="#5d6675" font-size="16">Use, revise, cite, escalate, or stop.</text>
    </g>
  </g>
  <path d="M735 131 C800 150 828 196 806 242 C784 289 836 322 881 302" fill="none" stroke="#ffd166" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 14" opacity="0.82"/>
  <text x="690" y="492" fill="#dbe6ff" font-family="Inter, system-ui, sans-serif" font-size="17">Fluent text is not evidence. Verification is a workflow.</text>
</svg>
