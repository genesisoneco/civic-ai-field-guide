<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">AI appeal path checklist flow</title>
  <desc id="desc">A five-step path: get the notice, gather records, ask what AI did, request human review, and record the outcome.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f3e8"/>
      <stop offset="1" stop-color="#eaf2ff"/>
    </linearGradient>
    <linearGradient id="step" x1="0" x2="1">
      <stop offset="0" stop-color="#2454ff"/>
      <stop offset="1" stop-color="#16a394"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#20304a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="960" height="420" rx="34" fill="url(#bg)"/>
  <g opacity="0.38" stroke="#b9c7df" stroke-width="1">
    <path d="M80 64H880M80 146H880M80 228H880M80 310H880"/>
    <path d="M144 46V374M304 46V374M464 46V374M624 46V374M784 46V374"/>
  </g>
  <text x="480" y="58" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="#1d2430">A simple path to question an AI-assisted decision</text>
  <text x="480" y="88" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#5d6675">Keep it concrete: notice, records, AI role, human review, outcome.</text>

  <g filter="url(#shadow)" font-family="Inter, system-ui, sans-serif">
    <g transform="translate(58 148)">
      <rect width="148" height="142" rx="24" fill="#fffaf0" stroke="#d4c7b4"/>
      <circle cx="74" cy="35" r="20" fill="url(#step)"/>
      <text x="74" y="42" text-anchor="middle" font-size="20" font-weight="900" fill="white">1</text>
      <text x="74" y="78" text-anchor="middle" font-size="19" font-weight="800" fill="#1d2430">Notice</text>
      <text x="74" y="104" text-anchor="middle" font-size="13" fill="#5d6675">What happened?</text>
      <text x="74" y="123" text-anchor="middle" font-size="13" fill="#5d6675">Who decided?</text>
    </g>
    <g transform="translate(244 148)">
      <rect width="148" height="142" rx="24" fill="#fffaf0" stroke="#d4c7b4"/>
      <circle cx="74" cy="35" r="20" fill="url(#step)"/>
      <text x="74" y="42" text-anchor="middle" font-size="20" font-weight="900" fill="white">2</text>
      <text x="74" y="78" text-anchor="middle" font-size="19" font-weight="800" fill="#1d2430">Records</text>
      <text x="74" y="104" text-anchor="middle" font-size="13" fill="#5d6675">Which facts, files,</text>
      <text x="74" y="123" text-anchor="middle" font-size="13" fill="#5d6675">or data were used?</text>
    </g>
    <g transform="translate(430 148)">
      <rect width="148" height="142" rx="24" fill="#fffaf0" stroke="#d4c7b4"/>
      <circle cx="74" cy="35" r="20" fill="url(#step)"/>
      <text x="74" y="42" text-anchor="middle" font-size="20" font-weight="900" fill="white">3</text>
      <text x="74" y="78" text-anchor="middle" font-size="19" font-weight="800" fill="#1d2430">AI role</text>
      <text x="74" y="104" text-anchor="middle" font-size="13" fill="#5d6675">Did AI score, rank,</text>
      <text x="74" y="123" text-anchor="middle" font-size="13" fill="#5d6675">flag, or draft?</text>
    </g>
    <g transform="translate(616 148)">
      <rect width="148" height="142" rx="24" fill="#fffaf0" stroke="#d4c7b4"/>
      <circle cx="74" cy="35" r="20" fill="url(#step)"/>
      <text x="74" y="42" text-anchor="middle" font-size="20" font-weight="900" fill="white">4</text>
      <text x="74" y="78" text-anchor="middle" font-size="19" font-weight="800" fill="#1d2430">Review</text>
      <text x="74" y="104" text-anchor="middle" font-size="13" fill="#5d6675">Ask a person with</text>
      <text x="74" y="123" text-anchor="middle" font-size="13" fill="#5d6675">authority to check.</text>
    </g>
    <g transform="translate(802 148)">
      <rect width="100" height="142" rx="24" fill="#fffaf0" stroke="#d4c7b4"/>
      <circle cx="50" cy="35" r="20" fill="url(#step)"/>
      <text x="50" y="42" text-anchor="middle" font-size="20" font-weight="900" fill="white">5</text>
      <text x="50" y="78" text-anchor="middle" font-size="18" font-weight="800" fill="#1d2430">Close</text>
      <text x="50" y="104" text-anchor="middle" font-size="13" fill="#5d6675">Fix, explain,</text>
      <text x="50" y="123" text-anchor="middle" font-size="13" fill="#5d6675">or escalate.</text>
    </g>
  </g>
  <g stroke="#2454ff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M214 219h20"/>
    <path d="M400 219h20"/>
    <path d="M586 219h20"/>
    <path d="M772 219h20"/>
  </g>
  <g fill="#2454ff" opacity="0.8">
    <path d="M236 219l-10-7v14z"/>
    <path d="M422 219l-10-7v14z"/>
    <path d="M608 219l-10-7v14z"/>
    <path d="M794 219l-10-7v14z"/>
  </g>
  <rect x="142" y="326" width="676" height="48" rx="24" fill="#18233b" opacity="0.94"/>
  <text x="480" y="356" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#f8fbff">The goal is not to win an argument with a machine. The goal is a reachable human process.</text>
</svg>
