<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 560">
  <title>AI vendor disclosure map</title>
  <desc>A six-step map showing the disclosures to request before adopting an AI system: purpose, evidence, data, human review, access and safety, and incident plan.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#20305c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1">
      <stop offset="0" stop-color="#fef7df"/>
      <stop offset="1" stop-color="#e9f6ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.26"/>
    </filter>
  </defs>
  <rect width="960" height="560" rx="36" fill="url(#bg)"/>
  <circle cx="92" cy="88" r="160" fill="#66e3d4" opacity="0.14"/>
  <circle cx="858" cy="470" r="190" fill="#8aa4ff" opacity="0.18"/>
  <text x="60" y="72" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800">Before adoption, ask for the evidence trail</text>
  <text x="60" y="108" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="18">If a vendor cannot answer, treat that as a risk signal — not a paperwork delay.</text>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <g transform="translate(60 160)">
      <rect width="250" height="120" rx="24" fill="url(#card)"/>
      <text x="24" y="40" fill="#1f2a44" font-size="22" font-weight="800">1. Purpose</text>
      <text x="24" y="72" fill="#465269" font-size="16">What exact decision or</text>
      <text x="24" y="94" fill="#465269" font-size="16">workflow is this for?</text>
    </g>
    <g transform="translate(355 160)">
      <rect width="250" height="120" rx="24" fill="url(#card)"/>
      <text x="24" y="40" fill="#1f2a44" font-size="22" font-weight="800">2. Evidence</text>
      <text x="24" y="72" fill="#465269" font-size="16">How was it tested in a</text>
      <text x="24" y="94" fill="#465269" font-size="16">similar real setting?</text>
    </g>
    <g transform="translate(650 160)">
      <rect width="250" height="120" rx="24" fill="url(#card)"/>
      <text x="24" y="40" fill="#1f2a44" font-size="22" font-weight="800">3. Data</text>
      <text x="24" y="72" fill="#465269" font-size="16">What data is collected,</text>
      <text x="24" y="94" fill="#465269" font-size="16">stored, shared, deleted?</text>
    </g>
    <g transform="translate(60 330)">
      <rect width="250" height="120" rx="24" fill="url(#card)"/>
      <text x="24" y="40" fill="#1f2a44" font-size="22" font-weight="800">4. Review</text>
      <text x="24" y="72" fill="#465269" font-size="16">Who can override, correct,</text>
      <text x="24" y="94" fill="#465269" font-size="16">appeal, or stop it?</text>
    </g>
    <g transform="translate(355 330)">
      <rect width="250" height="120" rx="24" fill="url(#card)"/>
      <text x="24" y="40" fill="#1f2a44" font-size="22" font-weight="800">5. Access</text>
      <text x="24" y="72" fill="#465269" font-size="16">Will it work fairly for</text>
      <text x="24" y="94" fill="#465269" font-size="16">disabled and multilingual users?</text>
    </g>
    <g transform="translate(650 330)">
      <rect width="250" height="120" rx="24" fill="url(#card)"/>
      <text x="24" y="40" fill="#1f2a44" font-size="22" font-weight="800">6. Incidents</text>
      <text x="24" y="72" fill="#465269" font-size="16">How are failures logged,</text>
      <text x="24" y="94" fill="#465269" font-size="16">reported, repaired?</text>
    </g>
  </g>
  <g stroke="#9fb7ff" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <path d="M310 220 H350"/>
    <path d="M605 220 H645"/>
    <path d="M775 282 V326"/>
    <path d="M650 390 H610"/>
    <path d="M355 390 H315"/>
  </g>
  <text x="60" y="510" fill="#dbeafe" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">A useful vendor answer names limits, test conditions, accountable people, and fallback procedures.</text>
</svg>
