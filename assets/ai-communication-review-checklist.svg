<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">AI communication review flow</title>
  <desc id="desc">A six-part flow for reviewing AI-assisted communications: purpose, facts, people, access, privacy, and publish or pause.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f4ea"/>
      <stop offset="1" stop-color="#dfe8ff"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2454ff"/>
      <stop offset="1" stop-color="#20b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#17213a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="960" height="520" rx="34" fill="url(#bg)"/>
  <g opacity="0.26" stroke="#7d8aa8" stroke-width="1">
    <path d="M80 90h800M80 170h800M80 250h800M80 330h800M80 410h800"/>
    <path d="M140 60v400M260 60v400M380 60v400M500 60v400M620 60v400M740 60v400M860 60v400"/>
  </g>
  <text x="480" y="64" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="30" font-weight="800" fill="#1c2430">Review AI-assisted public copy before it reaches people</text>
  <text x="480" y="99" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="17" fill="#465166">Not just “the draft sounds good” — check facts, rights, access, privacy, and accountability.</text>

  <g fill="none" stroke="#2454ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <path d="M222 194 C300 132 420 128 490 188"/>
    <path d="M473 186 l24 6 -10 -24"/>
    <path d="M658 194 C735 235 740 337 675 388"/>
    <path d="M681 365 l-8 25 25 -8"/>
    <path d="M301 388 C225 344 220 242 285 194"/>
    <path d="M279 218 l8 -25 -25 8"/>
  </g>

  <g font-family="system-ui, Segoe UI, sans-serif" filter="url(#shadow)">
    <g transform="translate(98 146)">
      <rect width="166" height="88" rx="22" fill="#fffaf0" stroke="#c9d2ea"/>
      <circle cx="32" cy="32" r="18" fill="url(#gate)"/>
      <text x="32" y="38" text-anchor="middle" font-size="18" font-weight="900" fill="#ffffff">1</text>
      <text x="62" y="34" font-size="22" font-weight="800" fill="#1c2430">Purpose</text>
      <text x="24" y="64" font-size="14" fill="#5d6675">Who needs this?</text>
    </g>
    <g transform="translate(326 132)">
      <rect width="166" height="88" rx="22" fill="#fffaf0" stroke="#c9d2ea"/>
      <circle cx="32" cy="32" r="18" fill="url(#gate)"/>
      <text x="32" y="38" text-anchor="middle" font-size="18" font-weight="900" fill="#ffffff">2</text>
      <text x="62" y="34" font-size="22" font-weight="800" fill="#1c2430">Facts</text>
      <text x="24" y="64" font-size="14" fill="#5d6675">Cited and current?</text>
    </g>
    <g transform="translate(574 146)">
      <rect width="180" height="88" rx="22" fill="#fffaf0" stroke="#c9d2ea"/>
      <circle cx="32" cy="32" r="18" fill="url(#gate)"/>
      <text x="32" y="38" text-anchor="middle" font-size="18" font-weight="900" fill="#ffffff">3</text>
      <text x="62" y="34" font-size="22" font-weight="800" fill="#1c2430">People</text>
      <text x="24" y="64" font-size="14" fill="#5d6675">Rights and tone?</text>
    </g>
    <g transform="translate(610 306)">
      <rect width="180" height="88" rx="22" fill="#fffaf0" stroke="#c9d2ea"/>
      <circle cx="32" cy="32" r="18" fill="url(#gate)"/>
      <text x="32" y="38" text-anchor="middle" font-size="18" font-weight="900" fill="#ffffff">4</text>
      <text x="62" y="34" font-size="22" font-weight="800" fill="#1c2430">Access</text>
      <text x="24" y="64" font-size="14" fill="#5d6675">Readable by all?</text>
    </g>
    <g transform="translate(374 332)">
      <rect width="180" height="88" rx="22" fill="#fffaf0" stroke="#c9d2ea"/>
      <circle cx="32" cy="32" r="18" fill="url(#gate)"/>
      <text x="32" y="38" text-anchor="middle" font-size="18" font-weight="900" fill="#ffffff">5</text>
      <text x="62" y="34" font-size="22" font-weight="800" fill="#1c2430">Privacy</text>
      <text x="24" y="64" font-size="14" fill="#5d6675">No hidden exposure?</text>
    </g>
    <g transform="translate(134 306)">
      <rect width="196" height="88" rx="22" fill="#fffaf0" stroke="#c9d2ea"/>
      <circle cx="32" cy="32" r="18" fill="url(#gate)"/>
      <text x="32" y="38" text-anchor="middle" font-size="18" font-weight="900" fill="#ffffff">6</text>
      <text x="62" y="34" font-size="22" font-weight="800" fill="#1c2430">Publish/Pause</text>
      <text x="24" y="64" font-size="14" fill="#5d6675">Name an owner.</text>
    </g>
  </g>

  <g transform="translate(335 225)">
    <rect width="290" height="86" rx="26" fill="#10131a" opacity="0.94"/>
    <text x="145" y="36" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#f8fbff">Public copy needs</text>
    <text x="145" y="63" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#77dfc8">accountable review</text>
  </g>
</svg>
