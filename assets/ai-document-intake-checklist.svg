<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">AI document intake decision flow</title>
  <desc id="desc">A five-step checklist: identify the document, classify sensitivity, check permission, reduce data, then approve for upload or keep out.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#12213f"/>
      <stop offset="1" stop-color="#0c1020"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f4ea"/>
      <stop offset="1" stop-color="#dfe8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7ee7d5"/>
    </marker>
  </defs>
  <rect width="1120" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="1010" cy="54" r="150" fill="#8aa4ff" opacity="0.16"/>
  <circle cx="120" cy="466" r="190" fill="#66e3d4" opacity="0.14"/>
  <text x="64" y="78" fill="#f8fbff" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="800">Before uploading a document into AI</text>
  <text x="64" y="114" fill="#b9c7e8" font-family="Inter, system-ui, sans-serif" font-size="18">Slow down long enough to classify risk, reduce exposure, and name who can approve the upload.</text>

  <g filter="url(#shadow)" font-family="Inter, system-ui, sans-serif">
    <g transform="translate(64 174)">
      <rect width="178" height="166" rx="24" fill="url(#card)"/>
      <circle cx="38" cy="38" r="19" fill="#2454ff"/>
      <text x="38" y="45" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">1</text>
      <text x="24" y="83" fill="#172033" font-size="22" font-weight="800">Identify</text>
      <text x="24" y="113" fill="#3e4a5f" font-size="15">What is it?</text>
      <text x="24" y="137" fill="#3e4a5f" font-size="15">Who owns it?</text>
    </g>
    <path d="M258 256 H314" stroke="#7ee7d5" stroke-width="5" marker-end="url(#arrow)"/>

    <g transform="translate(330 174)">
      <rect width="178" height="166" rx="24" fill="url(#card)"/>
      <circle cx="38" cy="38" r="19" fill="#2454ff"/>
      <text x="38" y="45" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">2</text>
      <text x="24" y="83" fill="#172033" font-size="22" font-weight="800">Classify</text>
      <text x="24" y="113" fill="#3e4a5f" font-size="15">Public, internal,</text>
      <text x="24" y="137" fill="#3e4a5f" font-size="15">sensitive, secret?</text>
    </g>
    <path d="M524 256 H580" stroke="#7ee7d5" stroke-width="5" marker-end="url(#arrow)"/>

    <g transform="translate(596 174)">
      <rect width="178" height="166" rx="24" fill="url(#card)"/>
      <circle cx="38" cy="38" r="19" fill="#2454ff"/>
      <text x="38" y="45" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">3</text>
      <text x="24" y="83" fill="#172033" font-size="22" font-weight="800">Check</text>
      <text x="24" y="113" fill="#3e4a5f" font-size="15">Policy, consent,</text>
      <text x="24" y="137" fill="#3e4a5f" font-size="15">contract, records</text>
    </g>
    <path d="M790 256 H846" stroke="#7ee7d5" stroke-width="5" marker-end="url(#arrow)"/>

    <g transform="translate(862 174)">
      <rect width="194" height="166" rx="24" fill="url(#card)"/>
      <circle cx="38" cy="38" r="19" fill="#2454ff"/>
      <text x="38" y="45" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">4</text>
      <text x="24" y="83" fill="#172033" font-size="22" font-weight="800">Reduce</text>
      <text x="24" y="113" fill="#3e4a5f" font-size="15">Remove data, use</text>
      <text x="24" y="137" fill="#3e4a5f" font-size="15">excerpts, de-identify</text>
    </g>
  </g>

  <g font-family="Inter, system-ui, sans-serif">
    <path d="M956 360 C956 410 894 416 802 416 H336 C238 416 184 412 184 362" fill="none" stroke="#ffd166" stroke-width="4" stroke-dasharray="10 10"/>
    <rect x="353" y="390" width="414" height="70" rx="22" fill="#101827" stroke="#ffd166" stroke-width="2"/>
    <text x="560" y="421" text-anchor="middle" fill="#fff8dd" font-size="21" font-weight="800">5. Decide and record</text>
    <text x="560" y="447" text-anchor="middle" fill="#dfe8ff" font-size="15">Approve with safeguards, ask for review, or keep the document out.</text>
  </g>
</svg>
