<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">AI procurement red flags checkpoint diagram</title>
  <desc id="desc">A six-step procurement checkpoint shows vendor claims, evidence, data terms, safeguards, recourse, and stop rules before an AI contract is approved.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101a35"/>
      <stop offset="1" stop-color="#14261f"/>
    </linearGradient>
    <linearGradient id="flag" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff7b72"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="960" height="520" rx="36" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#ffffff" stroke-width="1">
    <path d="M80 80H880M80 160H880M80 240H880M80 320H880M80 400H880"/>
    <path d="M140 50V470M260 50V470M380 50V470M500 50V470M620 50V470M740 50V470M860 50V470"/>
  </g>
  <text x="80" y="82" fill="#f8fbff" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="800">Before buying AI, ask for evidence.</text>
  <text x="80" y="122" fill="#b9c8e8" font-family="Inter, system-ui, sans-serif" font-size="18">A polished demo is not a procurement control.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="165" width="820" height="230" rx="28" fill="#fffaf0" opacity="0.96"/>
    <path d="M118 200v154" stroke="#243047" stroke-width="8" stroke-linecap="round"/>
    <path d="M126 204h122l-22 42 22 42H126z" fill="url(#flag)"/>
    <circle cx="118" cy="366" r="13" fill="#243047"/>

    <g font-family="Inter, system-ui, sans-serif" font-size="16" fill="#1d2430">
      <g transform="translate(292 204)">
        <circle cx="0" cy="0" r="28" fill="#2454ff" opacity="0.95"/>
        <text x="0" y="6" text-anchor="middle" fill="#fff" font-weight="800">1</text>
        <text x="-34" y="58" font-weight="800">Claims</text>
        <text x="-66" y="82" fill="#5d6675">What exactly</text>
        <text x="-66" y="104" fill="#5d6675">does it do?</text>
      </g>
      <g transform="translate(410 204)">
        <circle cx="0" cy="0" r="28" fill="#2454ff" opacity="0.95"/>
        <text x="0" y="6" text-anchor="middle" fill="#fff" font-weight="800">2</text>
        <text x="-38" y="58" font-weight="800">Evidence</text>
        <text x="-70" y="82" fill="#5d6675">Tested for this</text>
        <text x="-70" y="104" fill="#5d6675">setting?</text>
      </g>
      <g transform="translate(528 204)">
        <circle cx="0" cy="0" r="28" fill="#2454ff" opacity="0.95"/>
        <text x="0" y="6" text-anchor="middle" fill="#fff" font-weight="800">3</text>
        <text x="-24" y="58" font-weight="800">Data</text>
        <text x="-64" y="82" fill="#5d6675">Collected, kept,</text>
        <text x="-64" y="104" fill="#5d6675">trained on?</text>
      </g>
      <g transform="translate(646 204)">
        <circle cx="0" cy="0" r="28" fill="#2454ff" opacity="0.95"/>
        <text x="0" y="6" text-anchor="middle" fill="#fff" font-weight="800">4</text>
        <text x="-48" y="58" font-weight="800">Safeguards</text>
        <text x="-68" y="82" fill="#5d6675">Human review,</text>
        <text x="-68" y="104" fill="#5d6675">security, access?</text>
      </g>
      <g transform="translate(764 204)">
        <circle cx="0" cy="0" r="28" fill="#2454ff" opacity="0.95"/>
        <text x="0" y="6" text-anchor="middle" fill="#fff" font-weight="800">5</text>
        <text x="-36" y="58" font-weight="800">Recourse</text>
        <text x="-66" y="82" fill="#5d6675">Can people</text>
        <text x="-66" y="104" fill="#5d6675">appeal harm?</text>
      </g>
    </g>
    <path d="M318 204H382M436 204H500M554 204H618M672 204H736" stroke="#9aa8c2" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 12"/>
    <rect x="294" y="327" width="470" height="46" rx="23" fill="#116b59"/>
    <text x="529" y="357" text-anchor="middle" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800">Name stop rules before signing</text>
  </g>
  <text x="80" y="452" fill="#dbe6ff" font-family="Inter, system-ui, sans-serif" font-size="18">Pause when purpose, proof, data, accountability, accessibility, recourse, or exit terms are vague.</text>
</svg>
