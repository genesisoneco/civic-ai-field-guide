<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">AI classroom policy decision map</title>
  <desc id="desc">A classroom policy map with four lanes: allowed, limited, cited, and off-limits, connected to learning goals, privacy, accessibility, and assessment integrity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f3e8"/>
      <stop offset="1" stop-color="#dfe9ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#2454ff"/>
      <stop offset="1" stop-color="#20bfa9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#14213d" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="34" fill="url(#bg)"/>
  <g fill="none" stroke="#c1ccdc" stroke-width="2" opacity="0.55">
    <path d="M80 110h800M80 220h800M80 330h800M80 440h800"/>
    <path d="M190 70v400M390 70v400M590 70v400M790 70v400"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="62" width="820" height="96" rx="28" fill="#14213d"/>
    <text x="110" y="112" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Before students use AI, name the learning job.</text>
    <text x="112" y="139" fill="#cbd8f4" font-family="Inter, Arial, sans-serif" font-size="18">Policy works best when it distinguishes practice, support, citation, privacy, and assessment.</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-weight="800" text-anchor="middle">
    <rect x="80" y="202" width="170" height="86" rx="22" fill="#eaf8f3" stroke="#84d9c6"/>
    <text x="165" y="237" fill="#0b5d4f" font-size="22">Allowed</text>
    <text x="165" y="263" fill="#3d6c63" font-size="15" font-weight="600">low-risk practice</text>
    <rect x="290" y="202" width="170" height="86" rx="22" fill="#fff8dc" stroke="#f0cf69"/>
    <text x="375" y="237" fill="#755200" font-size="22">Limited</text>
    <text x="375" y="263" fill="#806c33" font-size="15" font-weight="600">teacher-guided</text>
    <rect x="500" y="202" width="170" height="86" rx="22" fill="#edf1ff" stroke="#9eb1ff"/>
    <text x="585" y="237" fill="#213fb2" font-size="22">Cited</text>
    <text x="585" y="263" fill="#5364a9" font-size="15" font-weight="600">disclosed use</text>
    <rect x="710" y="202" width="170" height="86" rx="22" fill="#fff0ec" stroke="#f0a089"/>
    <text x="795" y="237" fill="#8a2e17" font-size="22">Off-limits</text>
    <text x="795" y="263" fill="#8b5b4d" font-size="15" font-weight="600">when it replaces evidence</text>
  </g>
  <g stroke="url(#accent)" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M165 300c0 58 108 58 108 0"/>
    <path d="M375 300c0 58 108 58 108 0"/>
    <path d="M585 300c0 58 108 58 108 0"/>
    <path d="M375 175v-30"/>
    <path d="M585 175v-30"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" fill="#1d2430">
    <rect x="108" y="356" width="744" height="96" rx="24" fill="#ffffff" opacity="0.86" stroke="#cbd5e1"/>
    <text x="150" y="392" font-size="20" font-weight="800">Check the classroom conditions:</text>
    <text x="150" y="424" font-size="18">learning goal • privacy • accessibility • citation • equity • assessment integrity • human feedback</text>
  </g>
  <circle cx="840" cy="112" r="22" fill="#ffd166"/>
  <path d="M830 112l8 8 16-20" fill="none" stroke="#14213d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
