<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">AI system ownership loop</title>
  <desc id="desc">A diagram showing a named AI workflow owner connected to use purpose, human reviewers, affected people, pause authority, audit trail, and correction loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f3ea"/>
      <stop offset="1" stop-color="#e7f0ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2454ff"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#123" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2454ff"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="32" fill="url(#bg)"/>
  <circle cx="480" cy="250" r="98" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="480" y="230" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="800" fill="#fff">Named owner</text>
  <text x="480" y="266" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#ecfeff">can answer, pause,</text>
  <text x="480" y="291" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#ecfeff">correct, and review</text>

  <g font-family="Inter, system-ui, sans-serif" fill="#1d2430">
    <g filter="url(#shadow)">
      <rect x="54" y="68" width="236" height="92" rx="18" fill="#fffaf0" stroke="#ded2bd"/>
      <text x="172" y="106" text-anchor="middle" font-size="21" font-weight="800">Use purpose</text>
      <text x="172" y="134" text-anchor="middle" font-size="15" fill="#5d6675">what job, stakes, limits</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="670" y="68" width="236" height="92" rx="18" fill="#fffaf0" stroke="#ded2bd"/>
      <text x="788" y="106" text-anchor="middle" font-size="21" font-weight="800">Human reviewers</text>
      <text x="788" y="134" text-anchor="middle" font-size="15" fill="#5d6675">qualified checks, override</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="54" y="350" width="236" height="92" rx="18" fill="#fffaf0" stroke="#ded2bd"/>
      <text x="172" y="388" text-anchor="middle" font-size="21" font-weight="800">Affected people</text>
      <text x="172" y="416" text-anchor="middle" font-size="15" fill="#5d6675">notice, access, appeal</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="670" y="350" width="236" height="92" rx="18" fill="#fffaf0" stroke="#ded2bd"/>
      <text x="788" y="388" text-anchor="middle" font-size="21" font-weight="800">Pause + correct</text>
      <text x="788" y="416" text-anchor="middle" font-size="15" fill="#5d6675">stop harm, update policy</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="353" y="398" width="254" height="74" rx="18" fill="#10131a" stroke="#303746"/>
      <text x="480" y="429" text-anchor="middle" font-size="20" font-weight="800" fill="#f4efe4">Audit trail</text>
      <text x="480" y="454" text-anchor="middle" font-size="15" fill="#b8b0a2">records decisions and lessons</text>
    </g>
  </g>

  <g fill="none" stroke="#2454ff" stroke-width="4" marker-end="url(#arrow)" opacity="0.92">
    <path d="M290 114 C350 120 382 158 414 195"/>
    <path d="M670 114 C610 120 578 158 546 195"/>
    <path d="M290 396 C350 386 388 336 426 304"/>
    <path d="M670 396 C608 382 576 334 537 304"/>
    <path d="M515 347 C522 374 516 392 502 410"/>
  </g>
  <path d="M333 260 C268 260 225 298 204 351" fill="none" stroke="#8a3d00" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="198" y="276" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#8a3d00">questions and appeals must reach a person</text>
</svg>
