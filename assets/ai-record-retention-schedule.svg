<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 520" width="960" height="520">
  <title>AI record retention lifecycle</title>
  <desc>A timeline diagram showing AI-related records moving from creation to active use, scheduled review, archive or deletion, and deletion evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f4ea"/>
      <stop offset="1" stop-color="#dfe8ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2454ff"/>
      <stop offset="1" stop-color="#19a995"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#1d2430" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="960" height="520" rx="28" fill="url(#bg)"/>
  <g fill="none" stroke="#c4b99f" stroke-width="2" opacity="0.55">
    <path d="M70 95H890"/>
    <path d="M70 190H890"/>
    <path d="M70 285H890"/>
    <path d="M70 380H890"/>
  </g>
  <text x="70" y="62" font-family="Inter,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#1c2430">AI record retention lifecycle</text>
  <text x="70" y="92" font-family="Inter,Segoe UI,sans-serif" font-size="16" fill="#5d6675">Keep what is needed, review on time, and avoid permanent storage by accident.</text>
  <g transform="translate(88 160)" filter="url(#shadow)">
    <rect x="0" y="0" width="138" height="168" rx="22" fill="#fffaf0" stroke="#ded2bd"/>
    <circle cx="69" cy="46" r="26" fill="#fff1a8" stroke="#2454ff" stroke-width="3"/>
    <path d="M56 48l9 9 20-24" fill="none" stroke="#116b59" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="69" y="96" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="800" fill="#1c2430">Create</text>
    <text x="69" y="122" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="13" fill="#5d6675">prompts, uploads,</text>
    <text x="69" y="142" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="13" fill="#5d6675">outputs, logs</text>
  </g>
  <g transform="translate(292 160)" filter="url(#shadow)">
    <rect x="0" y="0" width="138" height="168" rx="22" fill="#fffaf0" stroke="#ded2bd"/>
    <rect x="43" y="22" width="52" height="52" rx="14" fill="#dfe8ff" stroke="#2454ff" stroke-width="3"/>
    <path d="M56 48h26M69 35v26" stroke="#2454ff" stroke-width="5" stroke-linecap="round"/>
    <text x="69" y="96" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="800" fill="#1c2430">Use</text>
    <text x="69" y="122" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="13" fill="#5d6675">active purpose</text>
    <text x="69" y="142" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="13" fill="#5d6675">and role access</text>
  </g>
  <g transform="translate(496 160)" filter="url(#shadow)">
    <rect x="0" y="0" width="138" height="168" rx="22" fill="#fffaf0" stroke="#ded2bd"/>
    <circle cx="69" cy="48" r="29" fill="#e8fff9" stroke="#19a995" stroke-width="3"/>
    <path d="M69 31v20l15 10" fill="none" stroke="#116b59" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="69" y="96" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="800" fill="#1c2430">Review</text>
    <text x="69" y="122" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="13" fill="#5d6675">calendar, hold,</text>
    <text x="69" y="142" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="13" fill="#5d6675">incident, appeal</text>
  </g>
  <g transform="translate(700 160)" filter="url(#shadow)">
    <rect x="0" y="0" width="172" height="168" rx="22" fill="#fffaf0" stroke="#ded2bd"/>
    <path d="M48 69h76" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
    <path d="M54 42h64l-10 55H64z" fill="#dfe8ff" stroke="#2454ff" stroke-width="3"/>
    <path d="M126 45l25 24-25 24" fill="none" stroke="#19a995" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="112" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="800" fill="#1c2430">Archive or delete</text>
    <text x="86" y="138" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="13" fill="#5d6675">with evidence, not raw copies</text>
  </g>
  <g stroke="url(#accent)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M236 244h42"/>
    <path d="M268 232l14 12-14 12"/>
    <path d="M440 244h42"/>
    <path d="M472 232l14 12-14 12"/>
    <path d="M644 244h42"/>
    <path d="M676 232l14 12-14 12"/>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="16" fill="#1c2430">
    <text x="100" y="402" font-weight="800">Schedule fields:</text>
    <text x="100" y="432">record type • owner • system • access • retention period • review date • hold rule • deletion proof</text>
  </g>
  <rect x="70" y="454" width="820" height="28" rx="14" fill="#fffaf0" stroke="#ded2bd"/>
  <rect x="70" y="454" width="585" height="28" rx="14" fill="url(#accent)" opacity="0.9"/>
  <text x="480" y="474" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#1c2430">Shorter retention reduces privacy risk; required records still need accountable preservation.</text>
</svg>
