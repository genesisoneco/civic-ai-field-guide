<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">AI risk register loop</title>
  <desc id="desc">A four-step loop for a lightweight AI risk register: list AI uses, name the owner, set safeguards, and review or stop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8df"/>
      <stop offset="1" stop-color="#e7f1ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#2454ff"/>
      <stop offset="1" stop-color="#1f9d86"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#172033" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="920" height="360" rx="34" fill="url(#bg)"/>
  <circle cx="156" cy="84" r="82" fill="#2454ff" opacity="0.08"/>
  <circle cx="782" cy="272" r="96" fill="#1f9d86" opacity="0.11"/>
  <path d="M260 180 C310 92 430 62 520 100 C598 133 638 196 628 268" fill="none" stroke="#1d2430" stroke-width="5" stroke-linecap="round" opacity="0.28"/>
  <path d="M622 268 l-27 -22 M622 268 l21 -29" fill="none" stroke="#1d2430" stroke-width="5" stroke-linecap="round" opacity="0.28"/>
  <path d="M660 180 C610 268 490 298 400 260 C322 227 282 164 292 92" fill="none" stroke="#1d2430" stroke-width="5" stroke-linecap="round" opacity="0.28"/>
  <path d="M298 92 l27 22 M298 92 l-21 29" fill="none" stroke="#1d2430" stroke-width="5" stroke-linecap="round" opacity="0.28"/>
  <g filter="url(#shadow)" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="52" y="96" width="190" height="128" rx="24" fill="#ffffff" stroke="#d7ccae"/>
    <text x="82" y="134" font-size="17" font-weight="800" fill="#2454ff">1. List uses</text>
    <text x="82" y="164" font-size="14" fill="#3d4658">Where AI affects</text>
    <text x="82" y="185" font-size="14" fill="#3d4658">people, records,</text>
    <text x="82" y="206" font-size="14" fill="#3d4658">or decisions</text>

    <rect x="268" y="36" width="190" height="128" rx="24" fill="#ffffff" stroke="#d7ccae"/>
    <text x="298" y="74" font-size="17" font-weight="800" fill="#2454ff">2. Name owner</text>
    <text x="298" y="104" font-size="14" fill="#3d4658">Who can answer,</text>
    <text x="298" y="125" font-size="14" fill="#3d4658">pause, fix, and</text>
    <text x="298" y="146" font-size="14" fill="#3d4658">notify</text>

    <rect x="486" y="96" width="190" height="128" rx="24" fill="#ffffff" stroke="#d7ccae"/>
    <text x="516" y="134" font-size="17" font-weight="800" fill="#1f7f70">3. Set safeguards</text>
    <text x="516" y="164" font-size="14" fill="#3d4658">Source checks,</text>
    <text x="516" y="185" font-size="14" fill="#3d4658">human review, and</text>
    <text x="516" y="206" font-size="14" fill="#3d4658">stop rules</text>

    <rect x="680" y="176" width="190" height="128" rx="24" fill="#ffffff" stroke="#d7ccae"/>
    <text x="710" y="214" font-size="17" font-weight="800" fill="#1f7f70">4. Review / stop</text>
    <text x="710" y="244" font-size="14" fill="#3d4658">Set a date, check</text>
    <text x="710" y="265" font-size="14" fill="#3d4658">evidence, retire</text>
    <text x="710" y="286" font-size="14" fill="#3d4658">unsafe uses</text>
  </g>
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="296" y="256" width="318" height="50" rx="25" fill="url(#accent)" opacity="0.95"/>
    <text x="455" y="287" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">Make the safe owner visible</text>
  </g>
</svg>
