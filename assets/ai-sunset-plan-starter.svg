<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 520">
  <title>AI sunset plan sequence</title>
  <desc>A six-step path for sunsetting an AI system: decide, freeze, preserve, transition, dispose, and review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f4ea"/>
      <stop offset="1" stop-color="#dfe8ff"/>
    </linearGradient>
    <linearGradient id="node" x1="0" x2="1">
      <stop offset="0" stop-color="#2454ff"/>
      <stop offset="1" stop-color="#66d6c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#1c2430" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="960" height="520" rx="34" fill="url(#bg)"/>
  <g opacity="0.25" stroke="#2454ff" stroke-width="1">
    <path d="M70 95H890M70 190H890M70 285H890M70 380H890M170 60V455M315 60V455M460 60V455M605 60V455M750 60V455"/>
  </g>
  <text x="80" y="72" fill="#1c2430" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="800">AI sunset plan</text>
  <text x="80" y="104" fill="#5d6675" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">A controlled off-ramp for records, continuity, data, and accountability.</text>

  <path d="M142 260H806" stroke="#2454ff" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
  <path d="M806 260l-24-18v36z" fill="#2454ff" opacity="0.45"/>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(145 260)">
      <circle r="54" fill="url(#node)"/>
      <text y="-6" fill="#07101d" font-size="17" font-weight="900">1</text>
      <text y="20" fill="#07101d" font-size="17" font-weight="900">Decide</text>
    </g>
    <g transform="translate(280 260)">
      <circle r="54" fill="url(#node)"/>
      <text y="-6" fill="#07101d" font-size="17" font-weight="900">2</text>
      <text y="20" fill="#07101d" font-size="17" font-weight="900">Freeze</text>
    </g>
    <g transform="translate(415 260)">
      <circle r="54" fill="url(#node)"/>
      <text y="-6" fill="#07101d" font-size="17" font-weight="900">3</text>
      <text y="20" fill="#07101d" font-size="17" font-weight="900">Preserve</text>
    </g>
    <g transform="translate(550 260)">
      <circle r="54" fill="url(#node)"/>
      <text y="-6" fill="#07101d" font-size="17" font-weight="900">4</text>
      <text y="20" fill="#07101d" font-size="17" font-weight="900">Transition</text>
    </g>
    <g transform="translate(685 260)">
      <circle r="54" fill="url(#node)"/>
      <text y="-6" fill="#07101d" font-size="17" font-weight="900">5</text>
      <text y="20" fill="#07101d" font-size="17" font-weight="900">Dispose</text>
    </g>
    <g transform="translate(820 260)">
      <circle r="54" fill="url(#node)"/>
      <text y="-6" fill="#07101d" font-size="17" font-weight="900">6</text>
      <text y="20" fill="#07101d" font-size="17" font-weight="900">Review</text>
    </g>
  </g>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#1c2430" font-size="15" text-anchor="middle">
    <text x="145" y="356">decision record</text>
    <text x="280" y="174">change freeze</text>
    <text x="415" y="356">records export</text>
    <text x="550" y="174">service handoff</text>
    <text x="685" y="356">delete / archive</text>
    <text x="820" y="174">lessons learned</text>
  </g>

  <g fill="none" stroke="#1c2430" stroke-width="2" opacity="0.45">
    <path d="M145 314v22"/>
    <path d="M280 206v-22"/>
    <path d="M415 314v22"/>
    <path d="M550 206v-22"/>
    <path d="M685 314v22"/>
    <path d="M820 206v-22"/>
  </g>

  <rect x="235" y="420" width="490" height="48" rx="24" fill="#fffaf0" stroke="#ded2bd"/>
  <text x="480" y="451" fill="#5d6675" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" text-anchor="middle">The goal is not just turning software off — it is leaving a checkable trail.</text>
</svg>
