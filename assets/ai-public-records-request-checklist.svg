<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI public records request review flow</title>
  <desc id="desc">A five-gate flow for reviewing AI-assisted public records work: intake, search, review, response, and record.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#10213f"/>
      <stop offset="0.55" stop-color="#152a4e"/>
      <stop offset="1" stop-color="#0e5b55"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1">
      <stop offset="0" stop-color="#fff7dd"/>
      <stop offset="1" stop-color="#e4f7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#001126" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#ffffff" stroke-width="1">
    <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/>
    <path d="M150 0V630M300 0V630M450 0V630M600 0V630M750 0V630M900 0V630M1050 0V630"/>
  </g>
  <circle cx="1060" cy="105" r="170" fill="#66e3d4" opacity="0.13"/>
  <circle cx="145" cy="520" r="190" fill="#8aa4ff" opacity="0.16"/>

  <text x="70" y="88" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="800">AI-assisted records response?</text>
  <text x="70" y="130" fill="#d7e5ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Do not let a fluent summary skip the public-records duty: search, review, redact, explain, and preserve.</text>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(70 205)">
      <rect width="190" height="230" rx="26" fill="url(#card)"/>
      <circle cx="95" cy="54" r="30" fill="#2454ff"/>
      <text x="95" y="64" fill="#ffffff" font-size="28" font-weight="800" text-anchor="middle">1</text>
      <text x="95" y="112" fill="#162033" font-size="26" font-weight="800" text-anchor="middle">Intake</text>
      <text x="95" y="150" fill="#3f4b5f" font-size="17" text-anchor="middle">Clarify scope,</text>
      <text x="95" y="174" fill="#3f4b5f" font-size="17" text-anchor="middle">dates, systems,</text>
      <text x="95" y="198" fill="#3f4b5f" font-size="17" text-anchor="middle">and deadlines.</text>
    </g>
    <g transform="translate(295 205)">
      <rect width="190" height="230" rx="26" fill="url(#card)"/>
      <circle cx="95" cy="54" r="30" fill="#2454ff"/>
      <text x="95" y="64" fill="#ffffff" font-size="28" font-weight="800" text-anchor="middle">2</text>
      <text x="95" y="112" fill="#162033" font-size="26" font-weight="800" text-anchor="middle">Search</text>
      <text x="95" y="150" fill="#3f4b5f" font-size="17" text-anchor="middle">Check AI hits</text>
      <text x="95" y="174" fill="#3f4b5f" font-size="17" text-anchor="middle">against source</text>
      <text x="95" y="198" fill="#3f4b5f" font-size="17" text-anchor="middle">repositories.</text>
    </g>
    <g transform="translate(520 205)">
      <rect width="190" height="230" rx="26" fill="url(#card)"/>
      <circle cx="95" cy="54" r="30" fill="#2454ff"/>
      <text x="95" y="64" fill="#ffffff" font-size="28" font-weight="800" text-anchor="middle">3</text>
      <text x="95" y="112" fill="#162033" font-size="26" font-weight="800" text-anchor="middle">Review</text>
      <text x="95" y="150" fill="#3f4b5f" font-size="17" text-anchor="middle">Verify records,</text>
      <text x="95" y="174" fill="#3f4b5f" font-size="17" text-anchor="middle">exemptions, and</text>
      <text x="95" y="198" fill="#3f4b5f" font-size="17" text-anchor="middle">redactions.</text>
    </g>
    <g transform="translate(745 205)">
      <rect width="190" height="230" rx="26" fill="url(#card)"/>
      <circle cx="95" cy="54" r="30" fill="#2454ff"/>
      <text x="95" y="64" fill="#ffffff" font-size="28" font-weight="800" text-anchor="middle">4</text>
      <text x="95" y="112" fill="#162033" font-size="26" font-weight="800" text-anchor="middle">Respond</text>
      <text x="95" y="150" fill="#3f4b5f" font-size="17" text-anchor="middle">Explain what</text>
      <text x="95" y="174" fill="#3f4b5f" font-size="17" text-anchor="middle">was found, held,</text>
      <text x="95" y="198" fill="#3f4b5f" font-size="17" text-anchor="middle">or withheld.</text>
    </g>
    <g transform="translate(970 205)">
      <rect width="160" height="230" rx="26" fill="url(#card)"/>
      <circle cx="80" cy="54" r="30" fill="#116b59"/>
      <text x="80" y="64" fill="#ffffff" font-size="28" font-weight="800" text-anchor="middle">5</text>
      <text x="80" y="112" fill="#162033" font-size="26" font-weight="800" text-anchor="middle">Record</text>
      <text x="80" y="150" fill="#3f4b5f" font-size="17" text-anchor="middle">Save search</text>
      <text x="80" y="174" fill="#3f4b5f" font-size="17" text-anchor="middle">notes and final</text>
      <text x="80" y="198" fill="#3f4b5f" font-size="17" text-anchor="middle">basis.</text>
    </g>
  </g>

  <g stroke="#d7e5ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M264 320h25"/>
    <path d="M489 320h25"/>
    <path d="M714 320h25"/>
    <path d="M939 320h25"/>
    <path d="M286 310l12 10-12 10M511 310l12 10-12 10M736 310l12 10-12 10M961 310l12 10-12 10"/>
  </g>

  <rect x="70" y="488" width="1060" height="78" rx="22" fill="#07101f" opacity="0.72" stroke="#85f1e6" stroke-opacity="0.38"/>
  <text x="98" y="522" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Stop rule:</text>
  <text x="220" y="522" fill="#d7e5ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">If AI found, summarized, or hid something, a human still has to verify the actual records and the legal basis.</text>
  <text x="98" y="552" fill="#aeece6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Public education, not legal advice. State and local public-records laws vary.</text>
</svg>
