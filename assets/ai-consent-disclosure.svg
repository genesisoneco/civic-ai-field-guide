<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">AI notice and consent ladder</title>
  <desc id="desc">A five-step ladder for responsible AI disclosure: name the AI use, explain the purpose, show the stakes, offer choice or review, and record feedback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f2df"/>
      <stop offset="1" stop-color="#dfe8ff"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2454ff"/>
      <stop offset="1" stop-color="#16a394"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1d2430" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="960" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="104" cy="92" r="72" fill="#fff8db" opacity="0.88"/>
  <circle cx="840" cy="428" r="106" fill="#d4fff8" opacity="0.65"/>
  <text x="70" y="76" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#1d2430">AI notice → consent ladder</text>
  <text x="72" y="112" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#526070">More impact means more explanation, choice, and human review.</text>

  <g filter="url(#shadow)">
    <rect x="90" y="344" width="780" height="68" rx="18" fill="#ffffff" stroke="#c9d3e6"/>
    <rect x="126" y="284" width="708" height="68" rx="18" fill="#ffffff" stroke="#c9d3e6"/>
    <rect x="162" y="224" width="636" height="68" rx="18" fill="#ffffff" stroke="#c9d3e6"/>
    <rect x="198" y="164" width="564" height="68" rx="18" fill="#ffffff" stroke="#c9d3e6"/>
    <rect x="234" y="104" width="492" height="68" rx="18" fill="#ffffff" stroke="#c9d3e6"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <circle cx="128" cy="378" r="22" fill="url(#step)"/>
      <text x="121" y="386" font-size="22" font-weight="800" fill="#fff">1</text>
      <text x="166" y="372" font-size="22" font-weight="800" fill="#1d2430">Name the AI use</text>
      <text x="166" y="398" font-size="16" fill="#526070">Say where AI is involved, not just “technology.”</text>
    </g>
    <g>
      <circle cx="164" cy="318" r="22" fill="url(#step)"/>
      <text x="157" y="326" font-size="22" font-weight="800" fill="#fff">2</text>
      <text x="202" y="312" font-size="22" font-weight="800" fill="#1d2430">Explain the purpose</text>
      <text x="202" y="338" font-size="16" fill="#526070">Summarize what the system does and does not decide.</text>
    </g>
    <g>
      <circle cx="200" cy="258" r="22" fill="url(#step)"/>
      <text x="193" y="266" font-size="22" font-weight="800" fill="#fff">3</text>
      <text x="238" y="252" font-size="22" font-weight="800" fill="#1d2430">Show the stakes</text>
      <text x="238" y="278" font-size="16" fill="#526070">Tell people what could affect them and what cannot.</text>
    </g>
    <g>
      <circle cx="236" cy="198" r="22" fill="url(#step)"/>
      <text x="229" y="206" font-size="22" font-weight="800" fill="#fff">4</text>
      <text x="274" y="192" font-size="22" font-weight="800" fill="#1d2430">Offer choice or review</text>
      <text x="274" y="218" font-size="16" fill="#526070">Provide opt-out, human review, appeal, or a safe alternative.</text>
    </g>
    <g>
      <circle cx="272" cy="138" r="22" fill="url(#step)"/>
      <text x="265" y="146" font-size="22" font-weight="800" fill="#fff">5</text>
      <text x="310" y="132" font-size="22" font-weight="800" fill="#1d2430">Record feedback</text>
      <text x="310" y="158" font-size="16" fill="#526070">Track corrections, complaints, and consent problems.</text>
    </g>
  </g>

  <path d="M736 142 C822 182 840 286 778 356" fill="none" stroke="#2454ff" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
  <path d="M780 354 l-2 -34 l-28 20" fill="none" stroke="#2454ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
  <text x="612" y="452" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526070">Use the lower steps for simple notice. Climb higher as risk, power imbalance, or personal impact grows.</text>
</svg>
