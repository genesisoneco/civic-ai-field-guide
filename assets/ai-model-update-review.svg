<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">AI model update review loop</title>
  <desc id="desc">A six-step loop for reviewing an AI model or feature update: notice, compare, test, update controls, communicate, and monitor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f4ea"/>
      <stop offset="1" stop-color="#e6f3ff"/>
    </linearGradient>
    <linearGradient id="node" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2454ff"/>
      <stop offset="1" stop-color="#16b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1c2430" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2l8 4-8 4z" fill="#5d6675"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="34" fill="url(#bg)"/>
  <text x="480" y="58" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" font-weight="800" fill="#1c2430">AI model update review</text>
  <text x="480" y="88" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#5d6675">Treat model and feature changes as change control, not background noise.</text>

  <path d="M295 170 C390 110 570 110 665 170" fill="none" stroke="#5d6675" stroke-width="4" marker-end="url(#arrow)" opacity=".65"/>
  <path d="M735 240 C775 320 720 410 635 438" fill="none" stroke="#5d6675" stroke-width="4" marker-end="url(#arrow)" opacity=".65"/>
  <path d="M555 455 C450 500 310 470 245 395" fill="none" stroke="#5d6675" stroke-width="4" marker-end="url(#arrow)" opacity=".65"/>
  <path d="M208 315 C170 250 205 195 260 168" fill="none" stroke="#5d6675" stroke-width="4" marker-end="url(#arrow)" opacity=".65"/>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" filter="url(#shadow)">
    <g transform="translate(92 128)">
      <rect width="220" height="102" rx="22" fill="#fffaf0" stroke="#ded2bd"/>
      <circle cx="42" cy="51" r="26" fill="url(#node)"/>
      <text x="42" y="60" text-anchor="middle" font-size="26" font-weight="900" fill="#ffffff">1</text>
      <text x="82" y="43" font-size="20" font-weight="800" fill="#1c2430">Notice</text>
      <text x="82" y="67" font-size="14" fill="#5d6675">What changed?</text>
    </g>
    <g transform="translate(370 120)">
      <rect width="220" height="102" rx="22" fill="#fffaf0" stroke="#ded2bd"/>
      <circle cx="42" cy="51" r="26" fill="url(#node)"/>
      <text x="42" y="60" text-anchor="middle" font-size="26" font-weight="900" fill="#ffffff">2</text>
      <text x="82" y="43" font-size="20" font-weight="800" fill="#1c2430">Compare</text>
      <text x="82" y="67" font-size="14" fill="#5d6675">What risk moved?</text>
    </g>
    <g transform="translate(648 128)">
      <rect width="220" height="102" rx="22" fill="#fffaf0" stroke="#ded2bd"/>
      <circle cx="42" cy="51" r="26" fill="url(#node)"/>
      <text x="42" y="60" text-anchor="middle" font-size="26" font-weight="900" fill="#ffffff">3</text>
      <text x="82" y="43" font-size="20" font-weight="800" fill="#1c2430">Test</text>
      <text x="82" y="67" font-size="14" fill="#5d6675">Local examples</text>
    </g>
    <g transform="translate(648 312)">
      <rect width="220" height="102" rx="22" fill="#fffaf0" stroke="#ded2bd"/>
      <circle cx="42" cy="51" r="26" fill="url(#node)"/>
      <text x="42" y="60" text-anchor="middle" font-size="26" font-weight="900" fill="#ffffff">4</text>
      <text x="82" y="43" font-size="20" font-weight="800" fill="#1c2430">Update controls</text>
      <text x="82" y="67" font-size="14" fill="#5d6675">Rules, access, logs</text>
    </g>
    <g transform="translate(370 320)">
      <rect width="220" height="102" rx="22" fill="#fffaf0" stroke="#ded2bd"/>
      <circle cx="42" cy="51" r="26" fill="url(#node)"/>
      <text x="42" y="60" text-anchor="middle" font-size="26" font-weight="900" fill="#ffffff">5</text>
      <text x="82" y="43" font-size="20" font-weight="800" fill="#1c2430">Communicate</text>
      <text x="82" y="67" font-size="14" fill="#5d6675">Notices and training</text>
    </g>
    <g transform="translate(92 312)">
      <rect width="220" height="102" rx="22" fill="#fffaf0" stroke="#ded2bd"/>
      <circle cx="42" cy="51" r="26" fill="url(#node)"/>
      <text x="42" y="60" text-anchor="middle" font-size="26" font-weight="900" fill="#ffffff">6</text>
      <text x="82" y="43" font-size="20" font-weight="800" fill="#1c2430">Monitor</text>
      <text x="82" y="67" font-size="14" fill="#5d6675">Watch failures</text>
    </g>
  </g>

  <g transform="translate(340 242)">
    <rect width="280" height="76" rx="20" fill="#1c2430" opacity=".92"/>
    <text x="140" y="32" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Decision gate</text>
    <text x="140" y="56" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#dbe6ff">Ship, hold, roll back, or limit scope</text>
  </g>
</svg>
