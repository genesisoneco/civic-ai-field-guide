<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">AI staff training log cycle</title>
  <desc id="desc">A five-part flow for AI staff training: assign roles, teach rules, practice scenarios, record evidence, and refresh after changes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f4ea"/>
      <stop offset="1" stop-color="#dfe8ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#17233f" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2454ff"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="32" fill="url(#bg)"/>
  <circle cx="108" cy="92" r="76" fill="#66e3d4" opacity="0.22"/>
  <circle cx="828" cy="426" r="116" fill="#8aa4ff" opacity="0.2"/>
  <text x="60" y="72" font-family="Inter, Segoe UI, sans-serif" font-size="34" font-weight="800" fill="#1c2430">Training should stay current.</text>
  <text x="60" y="108" font-family="Inter, Segoe UI, sans-serif" font-size="18" fill="#5d6675">Track who learned which AI rules, for which workflow, and when refresh is due.</text>

  <g filter="url(#shadow)" font-family="Inter, Segoe UI, sans-serif">
    <g transform="translate(60 170)">
      <rect width="150" height="160" rx="22" fill="url(#card)" stroke="#b9c4db"/>
      <circle cx="75" cy="42" r="24" fill="#2454ff" opacity="0.12"/>
      <text x="75" y="50" text-anchor="middle" font-size="24" font-weight="900" fill="#2454ff">1</text>
      <text x="75" y="86" text-anchor="middle" font-size="19" font-weight="800" fill="#1c2430">Assign</text>
      <text x="75" y="114" text-anchor="middle" font-size="13" fill="#5d6675">Name role, tool,</text>
      <text x="75" y="132" text-anchor="middle" font-size="13" fill="#5d6675">task, and limits.</text>
    </g>
    <g transform="translate(238 170)">
      <rect width="150" height="160" rx="22" fill="url(#card)" stroke="#b9c4db"/>
      <circle cx="75" cy="42" r="24" fill="#2454ff" opacity="0.12"/>
      <text x="75" y="50" text-anchor="middle" font-size="24" font-weight="900" fill="#2454ff">2</text>
      <text x="75" y="86" text-anchor="middle" font-size="19" font-weight="800" fill="#1c2430">Teach</text>
      <text x="75" y="114" text-anchor="middle" font-size="13" fill="#5d6675">Policy, privacy,</text>
      <text x="75" y="132" text-anchor="middle" font-size="13" fill="#5d6675">security, access.</text>
    </g>
    <g transform="translate(416 170)">
      <rect width="150" height="160" rx="22" fill="url(#card)" stroke="#b9c4db"/>
      <circle cx="75" cy="42" r="24" fill="#2454ff" opacity="0.12"/>
      <text x="75" y="50" text-anchor="middle" font-size="24" font-weight="900" fill="#2454ff">3</text>
      <text x="75" y="86" text-anchor="middle" font-size="19" font-weight="800" fill="#1c2430">Practice</text>
      <text x="75" y="114" text-anchor="middle" font-size="13" fill="#5d6675">Run scenarios</text>
      <text x="75" y="132" text-anchor="middle" font-size="13" fill="#5d6675">and stop rules.</text>
    </g>
    <g transform="translate(594 170)">
      <rect width="150" height="160" rx="22" fill="url(#card)" stroke="#b9c4db"/>
      <circle cx="75" cy="42" r="24" fill="#2454ff" opacity="0.12"/>
      <text x="75" y="50" text-anchor="middle" font-size="24" font-weight="900" fill="#2454ff">4</text>
      <text x="75" y="86" text-anchor="middle" font-size="19" font-weight="800" fill="#1c2430">Record</text>
      <text x="75" y="114" text-anchor="middle" font-size="13" fill="#5d6675">Date, evidence,</text>
      <text x="75" y="132" text-anchor="middle" font-size="13" fill="#5d6675">scope, owner.</text>
    </g>
    <g transform="translate(772 170)">
      <rect width="130" height="160" rx="22" fill="url(#card)" stroke="#b9c4db"/>
      <circle cx="65" cy="42" r="24" fill="#2454ff" opacity="0.12"/>
      <text x="65" y="50" text-anchor="middle" font-size="24" font-weight="900" fill="#2454ff">5</text>
      <text x="65" y="86" text-anchor="middle" font-size="19" font-weight="800" fill="#1c2430">Refresh</text>
      <text x="65" y="114" text-anchor="middle" font-size="13" fill="#5d6675">Update after</text>
      <text x="65" y="132" text-anchor="middle" font-size="13" fill="#5d6675">changes.</text>
    </g>
  </g>

  <g stroke="#2454ff" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M212 250 H232"/>
    <path d="M390 250 H410"/>
    <path d="M568 250 H588"/>
    <path d="M746 250 H766"/>
  </g>

  <rect x="148" y="390" width="664" height="58" rx="18" fill="#fff1a8" stroke="#d7c568"/>
  <text x="480" y="414" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="800" fill="#1c2430">Not just “AI training complete”</text>
  <text x="480" y="437" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#5d6675">A useful log names the workflow, data limits, review duties, evidence, and retraining trigger.</text>
</svg>
