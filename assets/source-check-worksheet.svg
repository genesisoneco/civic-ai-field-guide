<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 420">
  <title>AI source-check worksheet flow</title>
  <desc>A four-step flow showing how to check an AI answer: exact claim, original source, match quality, and safe action.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#10131a"/>
      <stop offset="1" stop-color="#1b2440"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#e7efff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="960" height="420" rx="34" fill="url(#bg)"/>
  <circle cx="108" cy="78" r="92" fill="#66e3d4" opacity="0.18"/>
  <circle cx="830" cy="342" r="150" fill="#8aa4ff" opacity="0.18"/>
  <text x="64" y="70" fill="#f8fbff" font-family="system-ui,Segoe UI,sans-serif" font-size="34" font-weight="800">AI source-check worksheet</text>
  <text x="64" y="104" fill="#c5d2ef" font-family="system-ui,Segoe UI,sans-serif" font-size="18">Verify the evidence chain before you rely on the answer.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="150" width="180" height="170" rx="24" fill="url(#card)"/>
    <rect x="284" y="150" width="180" height="170" rx="24" fill="url(#card)"/>
    <rect x="504" y="150" width="180" height="170" rx="24" fill="url(#card)"/>
    <rect x="724" y="150" width="180" height="170" rx="24" fill="url(#card)"/>
  </g>

  <g font-family="system-ui,Segoe UI,sans-serif">
    <g>
      <circle cx="104" cy="190" r="22" fill="#2454ff"/>
      <text x="104" y="198" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="900">1</text>
      <text x="84" y="236" fill="#1d2430" font-size="24" font-weight="900">Claim</text>
      <text x="84" y="264" fill="#4b5565" font-size="15">Copy the exact</text>
      <text x="84" y="284" fill="#4b5565" font-size="15">sentence to check.</text>
    </g>
    <g>
      <circle cx="324" cy="190" r="22" fill="#2454ff"/>
      <text x="324" y="198" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="900">2</text>
      <text x="304" y="236" fill="#1d2430" font-size="24" font-weight="900">Source</text>
      <text x="304" y="264" fill="#4b5565" font-size="15">Open the original,</text>
      <text x="304" y="284" fill="#4b5565" font-size="15">not the summary.</text>
    </g>
    <g>
      <circle cx="544" cy="190" r="22" fill="#2454ff"/>
      <text x="544" y="198" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="900">3</text>
      <text x="524" y="236" fill="#1d2430" font-size="24" font-weight="900">Match</text>
      <text x="524" y="264" fill="#4b5565" font-size="15">Does the source</text>
      <text x="524" y="284" fill="#4b5565" font-size="15">support the claim?</text>
    </g>
    <g>
      <circle cx="764" cy="190" r="22" fill="#2454ff"/>
      <text x="764" y="198" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="900">4</text>
      <text x="744" y="236" fill="#1d2430" font-size="24" font-weight="900">Action</text>
      <text x="744" y="264" fill="#4b5565" font-size="15">Use, revise, cite,</text>
      <text x="744" y="284" fill="#4b5565" font-size="15">ask, test, or stop.</text>
    </g>
  </g>

  <g fill="none" stroke="#66e3d4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M252 235h22"/>
    <path d="M267 222l15 13-15 13"/>
    <path d="M472 235h22"/>
    <path d="M487 222l15 13-15 13"/>
    <path d="M692 235h22"/>
    <path d="M707 222l15 13-15 13"/>
  </g>

  <rect x="64" y="352" width="832" height="1" fill="#ffffff" opacity="0.22"/>
  <text x="64" y="382" fill="#f8fbff" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700">Rule:</text>
  <text x="118" y="382" fill="#c5d2ef" font-family="system-ui,Segoe UI,sans-serif" font-size="18">If the source trail breaks and stakes are high, stop before sharing or acting.</text>
</svg>
