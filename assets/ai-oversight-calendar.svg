<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">AI oversight calendar rhythm</title>
  <desc id="desc">A calendar diagram showing monthly checks, quarterly drills, semiannual evidence review, annual renewal or sunset decisions, and event-triggered reviews after major changes or incidents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f4ea"/>
      <stop offset="1" stop-color="#eaf7f5"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" x2="1">
      <stop offset="0" stop-color="#2454ff"/>
      <stop offset="1" stop-color="#16a394"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1c2430" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#5d6675"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="34" fill="url(#bg)"/>
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" fill="#1c2430">
    <text x="56" y="68" font-size="30" font-weight="800">AI oversight calendar</text>
    <text x="56" y="100" font-size="17" fill="#5d6675">Turn post-launch governance into a rhythm people can actually remember.</text>

    <circle cx="480" cy="288" r="154" fill="none" stroke="url(#ring)" stroke-width="18" opacity="0.9"/>
    <circle cx="480" cy="288" r="96" fill="#fffaf0" stroke="#ded2bd" stroke-width="2" filter="url(#shadow)"/>
    <text x="423" y="278" font-size="22" font-weight="900">After launch</text>
    <text x="397" y="309" font-size="15" fill="#5d6675">review, refresh, record,</text>
    <text x="428" y="331" font-size="15" fill="#5d6675">pause if needed</text>

    <g filter="url(#shadow)">
      <rect x="78" y="162" width="212" height="106" rx="22" fill="#fffaf0" stroke="#ded2bd"/>
      <text x="110" y="202" font-size="18" font-weight="800">Monthly</text>
      <text x="110" y="232" font-size="14" fill="#5d6675">Check notices, logs,</text>
      <text x="110" y="252" font-size="14" fill="#5d6675">complaints, access, drift</text>
    </g>
    <line x1="292" y1="220" x2="361" y2="252" stroke="#5d6675" stroke-width="3" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="650" y="156" width="230" height="112" rx="22" fill="#eef4ff" stroke="#9eb3ff"/>
      <text x="682" y="197" font-size="18" font-weight="800">Quarterly</text>
      <text x="682" y="227" font-size="14" fill="#5d6675">Run incident drills,</text>
      <text x="682" y="247" font-size="14" fill="#5d6675">training, known-failure tests</text>
    </g>
    <line x1="650" y1="224" x2="599" y2="253" stroke="#5d6675" stroke-width="3" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="74" y="344" width="232" height="112" rx="22" fill="#effaf6" stroke="#85d9c9"/>
      <text x="106" y="385" font-size="18" font-weight="800">Semiannual</text>
      <text x="106" y="415" font-size="14" fill="#5d6675">Refresh evidence, risk,</text>
      <text x="106" y="435" font-size="14" fill="#5d6675">accessibility, records review</text>
    </g>
    <line x1="307" y1="396" x2="367" y2="338" stroke="#5d6675" stroke-width="3" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="650" y="346" width="230" height="110" rx="22" fill="#fff7e2" stroke="#ffd166"/>
      <text x="682" y="386" font-size="18" font-weight="800">Annual</text>
      <text x="682" y="416" font-size="14" fill="#5d6675">Renew, narrow, replace,</text>
      <text x="682" y="436" font-size="14" fill="#5d6675">or sunset the AI workflow</text>
    </g>
    <line x1="650" y1="398" x2="595" y2="340" stroke="#5d6675" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="315" y="448" width="330" height="52" rx="26" fill="#fff1e8" stroke="#ffb86b"/>
    <text x="355" y="481" font-size="17" font-weight="900" fill="#8a3d00">Event-triggered review: incident, vendor change, expansion</text>
  </g>
</svg>
