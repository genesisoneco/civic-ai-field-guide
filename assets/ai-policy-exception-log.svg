<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">AI policy exception log lifecycle</title>
  <desc id="desc">A five-step flow showing an AI policy exception moving from request to risk review, approval, expiry date, and review or closure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f4ea"/>
      <stop offset="1" stop-color="#dfe8ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#17233f" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2454ff"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="32" fill="url(#bg)"/>
  <circle cx="98" cy="86" r="72" fill="#66e3d4" opacity="0.22"/>
  <circle cx="838" cy="438" r="108" fill="#8aa4ff" opacity="0.2"/>
  <text x="60" y="72" font-family="Inter, Segoe UI, sans-serif" font-size="34" font-weight="800" fill="#1c2430">Policy exceptions should expire.</text>
  <text x="60" y="108" font-family="Inter, Segoe UI, sans-serif" font-size="18" fill="#5d6675">Log the reason, risk, owner, safeguards, date, and closure decision.</text>

  <g filter="url(#shadow)" font-family="Inter, Segoe UI, sans-serif">
    <g transform="translate(60 170)">
      <rect width="150" height="160" rx="22" fill="url(#card)" stroke="#b9c4db"/>
      <circle cx="75" cy="42" r="24" fill="#2454ff" opacity="0.12"/>
      <text x="75" y="50" text-anchor="middle" font-size="24" font-weight="900" fill="#2454ff">1</text>
      <text x="75" y="86" text-anchor="middle" font-size="19" font-weight="800" fill="#1c2430">Request</text>
      <text x="75" y="114" text-anchor="middle" font-size="13" fill="#5d6675">What rule cannot</text>
      <text x="75" y="132" text-anchor="middle" font-size="13" fill="#5d6675">be followed now?</text>
    </g>
    <g transform="translate(238 170)">
      <rect width="150" height="160" rx="22" fill="url(#card)" stroke="#b9c4db"/>
      <circle cx="75" cy="42" r="24" fill="#2454ff" opacity="0.12"/>
      <text x="75" y="50" text-anchor="middle" font-size="24" font-weight="900" fill="#2454ff">2</text>
      <text x="75" y="86" text-anchor="middle" font-size="19" font-weight="800" fill="#1c2430">Risk</text>
      <text x="75" y="114" text-anchor="middle" font-size="13" fill="#5d6675">Who could be</text>
      <text x="75" y="132" text-anchor="middle" font-size="13" fill="#5d6675">affected differently?</text>
    </g>
    <g transform="translate(416 170)">
      <rect width="150" height="160" rx="22" fill="url(#card)" stroke="#b9c4db"/>
      <circle cx="75" cy="42" r="24" fill="#2454ff" opacity="0.12"/>
      <text x="75" y="50" text-anchor="middle" font-size="24" font-weight="900" fill="#2454ff">3</text>
      <text x="75" y="86" text-anchor="middle" font-size="19" font-weight="800" fill="#1c2430">Approve</text>
      <text x="75" y="114" text-anchor="middle" font-size="13" fill="#5d6675">Name owner and</text>
      <text x="75" y="132" text-anchor="middle" font-size="13" fill="#5d6675">temporary controls.</text>
    </g>
    <g transform="translate(594 170)">
      <rect width="150" height="160" rx="22" fill="url(#card)" stroke="#b9c4db"/>
      <circle cx="75" cy="42" r="24" fill="#2454ff" opacity="0.12"/>
      <text x="75" y="50" text-anchor="middle" font-size="24" font-weight="900" fill="#2454ff">4</text>
      <text x="75" y="86" text-anchor="middle" font-size="19" font-weight="800" fill="#1c2430">Expire</text>
      <text x="75" y="114" text-anchor="middle" font-size="13" fill="#5d6675">Set a review date</text>
      <text x="75" y="132" text-anchor="middle" font-size="13" fill="#5d6675">before drift sets in.</text>
    </g>
    <g transform="translate(772 170)">
      <rect width="130" height="160" rx="22" fill="url(#card)" stroke="#b9c4db"/>
      <circle cx="65" cy="42" r="24" fill="#2454ff" opacity="0.12"/>
      <text x="65" y="50" text-anchor="middle" font-size="24" font-weight="900" fill="#2454ff">5</text>
      <text x="65" y="86" text-anchor="middle" font-size="19" font-weight="800" fill="#1c2430">Close</text>
      <text x="65" y="114" text-anchor="middle" font-size="13" fill="#5d6675">End, renew,</text>
      <text x="65" y="132" text-anchor="middle" font-size="13" fill="#5d6675">or fix policy.</text>
    </g>
  </g>

  <g stroke="#2454ff" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M212 250 H232"/>
    <path d="M390 250 H410"/>
    <path d="M568 250 H588"/>
    <path d="M746 250 H766"/>
  </g>

  <rect x="164" y="390" width="632" height="56" rx="18" fill="#fff1a8" stroke="#d7c568"/>
  <text x="480" y="414" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="800" fill="#1c2430">No open-ended exceptions</text>
  <text x="480" y="436" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#5d6675">A log turns “we had to work around it” into a checkable decision with safeguards and a deadline.</text>
</svg>
