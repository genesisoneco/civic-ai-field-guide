<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">AI evaluation evidence checklist diagram</title>
  <desc id="desc">A six-step evidence path for AI evaluation: purpose, realistic tests, measured results, failure cases, monitoring, and a rely or revise decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f9f1df"/>
      <stop offset="1" stop-color="#dfe8ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#2454ff"/>
      <stop offset="1" stop-color="#18a999"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#17213a" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2454ff"/>
    </marker>
  </defs>
  <rect width="1200" height="640" rx="36" fill="url(#bg)"/>
  <g opacity="0.45" stroke="#9cafdb" stroke-width="1">
    <path d="M80 120H1120M80 220H1120M80 320H1120M80 420H1120M80 520H1120"/>
    <path d="M160 70V570M360 70V570M560 70V570M760 70V570M960 70V570"/>
  </g>
  <text x="80" y="78" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="800" fill="#172033">Evidence before reliance</text>
  <text x="80" y="114" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#526071">Do not ask “Is it AI?” first. Ask what evidence shows it works here, for these people, with safe fallback.</text>

  <g filter="url(#shadow)" font-family="Inter, system-ui, sans-serif">
    <g transform="translate(70 178)">
      <rect width="160" height="154" rx="24" fill="#fffaf0" stroke="#d4c8b4"/>
      <circle cx="42" cy="42" r="22" fill="url(#accent)"/>
      <text x="42" y="50" text-anchor="middle" font-size="24" font-weight="900" fill="#ffffff">1</text>
      <text x="24" y="88" font-size="20" font-weight="800" fill="#172033">Purpose</text>
      <text x="24" y="116" font-size="15" fill="#526071">Exact task and</text>
      <text x="24" y="137" font-size="15" fill="#526071">decision boundary</text>
    </g>
    <path d="M242 255H300" stroke="#2454ff" stroke-width="5" marker-end="url(#arrow)"/>

    <g transform="translate(312 178)">
      <rect width="160" height="154" rx="24" fill="#fffaf0" stroke="#d4c8b4"/>
      <circle cx="42" cy="42" r="22" fill="url(#accent)"/>
      <text x="42" y="50" text-anchor="middle" font-size="24" font-weight="900" fill="#ffffff">2</text>
      <text x="24" y="88" font-size="20" font-weight="800" fill="#172033">Test cases</text>
      <text x="24" y="116" font-size="15" fill="#526071">Real data, edge</text>
      <text x="24" y="137" font-size="15" fill="#526071">cases, affected users</text>
    </g>
    <path d="M484 255H542" stroke="#2454ff" stroke-width="5" marker-end="url(#arrow)"/>

    <g transform="translate(554 178)">
      <rect width="160" height="154" rx="24" fill="#fffaf0" stroke="#d4c8b4"/>
      <circle cx="42" cy="42" r="22" fill="url(#accent)"/>
      <text x="42" y="50" text-anchor="middle" font-size="24" font-weight="900" fill="#ffffff">3</text>
      <text x="24" y="88" font-size="20" font-weight="800" fill="#172033">Results</text>
      <text x="24" y="116" font-size="15" fill="#526071">Metrics that match</text>
      <text x="24" y="137" font-size="15" fill="#526071">the real risk</text>
    </g>
    <path d="M726 255H784" stroke="#2454ff" stroke-width="5" marker-end="url(#arrow)"/>

    <g transform="translate(796 178)">
      <rect width="160" height="154" rx="24" fill="#fffaf0" stroke="#d4c8b4"/>
      <circle cx="42" cy="42" r="22" fill="url(#accent)"/>
      <text x="42" y="50" text-anchor="middle" font-size="24" font-weight="900" fill="#ffffff">4</text>
      <text x="24" y="88" font-size="20" font-weight="800" fill="#172033">Failures</text>
      <text x="24" y="116" font-size="15" fill="#526071">What breaks, whom</text>
      <text x="24" y="137" font-size="15" fill="#526071">it affects, fixes</text>
    </g>
    <path d="M968 255H1026" stroke="#2454ff" stroke-width="5" marker-end="url(#arrow)"/>

    <g transform="translate(1038 178)">
      <rect width="110" height="154" rx="24" fill="#fffaf0" stroke="#d4c8b4"/>
      <circle cx="42" cy="42" r="22" fill="url(#accent)"/>
      <text x="42" y="50" text-anchor="middle" font-size="24" font-weight="900" fill="#ffffff">5</text>
      <text x="24" y="88" font-size="20" font-weight="800" fill="#172033">Watch</text>
      <text x="24" y="116" font-size="15" fill="#526071">Monitor</text>
      <text x="24" y="137" font-size="15" fill="#526071">change</text>
    </g>
  </g>

  <g font-family="Inter, system-ui, sans-serif">
    <rect x="250" y="420" width="700" height="104" rx="26" fill="#172033" opacity="0.94"/>
    <text x="600" y="462" text-anchor="middle" font-size="26" font-weight="900" fill="#ffffff">Decision: rely, limit, retest, or stop?</text>
    <text x="600" y="494" text-anchor="middle" font-size="17" fill="#dbe6ff">If evidence is missing or mismatched, narrow the use before people depend on it.</text>
  </g>
</svg>
