<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">AI meeting notes safety loop</title>
  <desc id="desc">A four-step loop for safer AI meeting notes: consent, data boundary, human review, and record label.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f3ea"/>
      <stop offset="1" stop-color="#dbe7ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#14213d" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="36" fill="url(#bg)"/>
  <circle cx="150" cy="90" r="90" fill="#66e3d4" opacity="0.24"/>
  <circle cx="820" cy="470" r="120" fill="#8aa4ff" opacity="0.22"/>
  <text x="480" y="70" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="800" fill="#1d2430">Before AI summarizes a meeting</text>
  <text x="480" y="105" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#5d6675">Use the assistant for a draft, not an invisible authority.</text>

  <g filter="url(#shadow)">
    <rect x="74" y="165" width="190" height="155" rx="24" fill="url(#card)" stroke="#b8c3d9"/>
    <rect x="306" y="165" width="190" height="155" rx="24" fill="url(#card)" stroke="#b8c3d9"/>
    <rect x="538" y="165" width="190" height="155" rx="24" fill="url(#card)" stroke="#b8c3d9"/>
    <rect x="770" y="165" width="150" height="155" rx="24" fill="url(#card)" stroke="#b8c3d9"/>
  </g>

  <g font-family="Inter, system-ui, sans-serif" fill="#1d2430">
    <circle cx="169" cy="205" r="24" fill="#2454ff"/>
    <path d="M158 204l8 8 18-22" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="169" y="250" text-anchor="middle" font-size="21" font-weight="800">Consent</text>
    <text x="169" y="278" text-anchor="middle" font-size="14" fill="#5d6675">Tell people what is</text>
    <text x="169" y="298" text-anchor="middle" font-size="14" fill="#5d6675">recorded and by whom.</text>

    <circle cx="401" cy="205" r="24" fill="#2454ff"/>
    <path d="M389 217v-26h24v26m-18-17h12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="401" y="250" text-anchor="middle" font-size="21" font-weight="800">Data boundary</text>
    <text x="401" y="278" text-anchor="middle" font-size="14" fill="#5d6675">Keep secrets and personal</text>
    <text x="401" y="298" text-anchor="middle" font-size="14" fill="#5d6675">data out when possible.</text>

    <circle cx="633" cy="205" r="24" fill="#2454ff"/>
    <path d="M620 205c7-12 19-12 26 0-7 12-19 12-26 0z" fill="none" stroke="#fff" stroke-width="5"/>
    <circle cx="633" cy="205" r="4" fill="#fff"/>
    <text x="633" y="250" text-anchor="middle" font-size="21" font-weight="800">Human review</text>
    <text x="633" y="278" text-anchor="middle" font-size="14" fill="#5d6675">Correct names, decisions,</text>
    <text x="633" y="298" text-anchor="middle" font-size="14" fill="#5d6675">risks, and action items.</text>

    <circle cx="845" cy="205" r="24" fill="#2454ff"/>
    <path d="M834 192h19l7 7v18h-26z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
    <path d="M852 193v8h8" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
    <text x="845" y="250" text-anchor="middle" font-size="21" font-weight="800">Label</text>
    <text x="845" y="278" text-anchor="middle" font-size="14" fill="#5d6675">Mark draft, final,</text>
    <text x="845" y="298" text-anchor="middle" font-size="14" fill="#5d6675">or official record.</text>
  </g>

  <g fill="none" stroke="#2454ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <path d="M267 242h36"/>
    <path d="M294 232l12 10-12 10"/>
    <path d="M500 242h33"/>
    <path d="M524 232l12 10-12 10"/>
    <path d="M731 242h35"/>
    <path d="M757 232l12 10-12 10"/>
  </g>

  <rect x="128" y="382" width="704" height="70" rx="22" fill="#10131a" opacity="0.92"/>
  <text x="480" y="412" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#f8fbff">Safe default</text>
  <text x="480" y="438" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#dbe6ff">If the meeting affects people, treat AI notes as a reviewed draft until humans agree what the record says.</text>
</svg>
