<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI handoff packet map</title>
  <desc id="desc">A central handoff packet connects system purpose, owner roles, risk status, records, credentials, monitoring, open issues, and stop authority.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#fff4df"/>
    </linearGradient>
    <linearGradient id="packet" x1="0" x2="1">
      <stop offset="0" stop-color="#2454ff"/>
      <stop offset="1" stop-color="#12a594"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1c2430" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="42" fill="url(#bg)"/>
  <g opacity="0.22" stroke="#2454ff" stroke-width="2">
    <path d="M90 116h1020M90 250h1020M90 384h1020M90 518h1020M210 72v576M390 72v576M570 72v576M750 72v576M930 72v576"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="385" y="190" width="430" height="300" rx="34" fill="url(#packet)"/>
    <path d="M460 266h280M460 324h280M460 382h220" stroke="#fff" stroke-width="20" stroke-linecap="round" opacity="0.9"/>
    <text x="600" y="242" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#fff">AI handoff packet</text>
    <text x="600" y="442" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#efffff">Context travels before ownership changes</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#1c2430">
    <g>
      <rect x="86" y="88" width="300" height="86" rx="22" fill="#ffffff" stroke="#c7d5ee"/>
      <text x="236" y="124" text-anchor="middle">Purpose + scope</text>
      <text x="236" y="153" text-anchor="middle" font-size="16" font-weight="600" fill="#5d6675">What it does and should not do</text>
    </g>
    <g>
      <rect x="815" y="88" width="300" height="86" rx="22" fill="#ffffff" stroke="#c7d5ee"/>
      <text x="965" y="124" text-anchor="middle">Owner roles</text>
      <text x="965" y="153" text-anchor="middle" font-size="16" font-weight="600" fill="#5d6675">Who decides, fixes, pauses</text>
    </g>
    <g>
      <rect x="86" y="260" width="300" height="86" rx="22" fill="#ffffff" stroke="#c7d5ee"/>
      <text x="236" y="296" text-anchor="middle">Risk status</text>
      <text x="236" y="325" text-anchor="middle" font-size="16" font-weight="600" fill="#5d6675">Known failures and safeguards</text>
    </g>
    <g>
      <rect x="815" y="260" width="300" height="86" rx="22" fill="#ffffff" stroke="#c7d5ee"/>
      <text x="965" y="296" text-anchor="middle">Records + data</text>
      <text x="965" y="325" text-anchor="middle" font-size="16" font-weight="600" fill="#5d6675">Retention, exports, deletion</text>
    </g>
    <g>
      <rect x="86" y="432" width="300" height="86" rx="22" fill="#ffffff" stroke="#c7d5ee"/>
      <text x="236" y="468" text-anchor="middle">Credentials</text>
      <text x="236" y="497" text-anchor="middle" font-size="16" font-weight="600" fill="#5d6675">Accounts, keys, vendors</text>
    </g>
    <g>
      <rect x="815" y="432" width="300" height="86" rx="22" fill="#ffffff" stroke="#c7d5ee"/>
      <text x="965" y="468" text-anchor="middle">Monitoring + stops</text>
      <text x="965" y="497" text-anchor="middle" font-size="16" font-weight="600" fill="#5d6675">Alerts, incidents, stop authority</text>
    </g>
  </g>
  <g stroke="#2454ff" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <path d="M386 132C440 156 468 176 500 206" fill="none"/>
    <path d="M815 132C760 156 732 176 700 206" fill="none"/>
    <path d="M386 302h92"/>
    <path d="M815 302h-92"/>
    <path d="M386 476C438 452 468 430 500 404" fill="none"/>
    <path d="M815 476C762 452 732 430 700 404" fill="none"/>
  </g>
  <text x="600" y="632" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c2430">A useful transfer names what must continue, what must stop, and who has authority on day one.</text>
</svg>
